<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業票一覧 — 阿武隈風力発電</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d; --txt:#c9d1d9; --muted:#8b949e;
    --master:#58a6ff; --insp:#3fb950; --defect:#f85149; --work:#d29922; --stop:#ff5630;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;padding:28px;line-height:1.6;max-width:1280px;margin:0 auto}
  h1{font-size:23px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .bar input,.bar select{background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:8px;font-size:12.5px}
  button.r{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:12.5px}
  button.r:hover{border-color:var(--master)}

  .cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .kpi{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 16px}
  .kpi .v{font-size:26px;font-weight:700;color:#fff}
  .kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
  .kpi.alert .v{color:var(--stop)}

  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:12.5px}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--panel2);color:#fff;font-size:11.5px;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  td.no{color:#fff;font-weight:600;white-space:nowrap}
  td.desc{max-width:280px}
  .empty{text-align:center;color:var(--muted);padding:36px;font-size:13px}
  footer{margin-top:28px;color:var(--muted);font-size:11.5px;border-top:1px solid var(--line);padding-top:14px}
  code{color:var(--master);background:#0d1117;padding:1px 5px;border-radius:4px;font-size:11px}
  a.menu{color:#58a6ff;text-decoration:none;font-size:12.5px}
</style>
</head>
<body>
  <div style="margin-bottom:10px"><a class="menu" href="./menu.html">≡ メニューへ戻る</a></div>
  <h1>作業票一覧</h1>
  <div class="sub">阿武隈風力発電所 / ビュー <code>v_work_orders_full</code> をライブ取得（JST・絵文字ステータス付与済み）</div>

  <div class="cards">
    <div class="kpi"><div class="v" id="kTotal">–</div><div class="l">作業票（合計）</div></div>
    <div class="kpi alert"><div class="v" id="kOpen">–</div><div class="l">未完了</div></div>
    <div class="kpi"><div class="v" id="kStop">–</div><div class="l">停止影響あり</div></div>
    <div class="kpi"><div class="v" id="kAtt">–</div><div class="l">添付あり</div></div>
  </div>

  <div class="bar">
    <input id="q" type="text" placeholder="🔍 風車・番号・概要で絞り込み" oninput="apply()">
    <select id="fOpen" onchange="apply()">
      <option value="all">すべて</option>
      <option value="open">未完了のみ</option>
      <option value="done">完了のみ</option>
    </select>
    <button class="r" onclick="load()">↻ 再読み込み</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>作業票番号</th><th>風車</th><th>種別</th><th>概要</th>
        <th>優先度</th><th>状態</th><th>対応予定</th><th>停止(分)</th>
        <th>逸失kWh</th><th>添付</th><th>起票日時</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="11" class="empty">ログインするとデータを取得します…</td></tr>
    </tbody>
  </table>

  <footer>
    データ元: <code>v_work_orders_full</code>（work_orders ＋ 関連異常・添付数・JST変換）。
    本画面は閲覧用。作業票の作成・更新は業務OS（Budibase）側で行う運用。
  </footer>

  <script src="./lib/supabase.js"></script>
  <script>
    let ALL = [];

    async function load(){
      const rows = document.getElementById('rows');
      rows.innerHTML = '<tr><td colspan="11" class="empty">取得中…</td></tr>';
      try{
        const order = encodeURIComponent('起票日時_jst');
        ALL = await sb.get(`v_work_orders_full?select=*&order=${order}.desc`);
        renderKpi(ALL);
        apply();
      }catch(e){
        rows.innerHTML = `<tr><td colspan="11" class="empty">取得エラー: ${sb.esc(e.message)}（権限／RLSを確認）</td></tr>`;
      }
    }

    function renderKpi(d){
      document.getElementById('kTotal').textContent = d.length;
      document.getElementById('kOpen').textContent  = d.filter(r=>!r['完了日時_jst']).length;
      document.getElementById('kStop').textContent  = d.filter(r=>(r['停止時間min']||0)>0).length;
      document.getElementById('kAtt').textContent   = d.filter(r=>(r['添付数']||0)>0).length;
    }

    function apply(){
      const q = document.getElementById('q').value.trim().toLowerCase();
      const f = document.getElementById('fOpen').value;
      let d = ALL;
      if(f==='open') d = d.filter(r=>!r['完了日時_jst']);
      if(f==='done') d = d.filter(r=> r['完了日時_jst']);
      if(q){
        d = d.filter(r => [r['作業票番号'],r['風車'],r['異常概要'],r['関連異常タイトル'],r['作業種別']]
          .some(v => (v||'').toLowerCase().includes(q)));
      }
      render(d);
    }

    function render(d){
      const rows = document.getElementById('rows');
      if(!d.length){ rows.innerHTML = '<tr><td colspan="11" class="empty">該当する作業票はありません</td></tr>'; return; }
      rows.innerHTML = d.map(r=>`<tr>
        <td class="no">${sb.esc(r['作業票番号'])}</td>
        <td>${sb.esc(r['風車'])||'–'}</td>
        <td>${sb.esc(r['作業種別'])||'–'}</td>
        <td class="desc">${sb.esc(r['異常概要']||r['関連異常タイトル'])||'–'}</td>
        <td>${sb.esc(r['優先度表示']||r['優先度'])||'–'}</td>
        <td>${sb.esc(r['状態表示']||r['状態'])||'–'}</td>
        <td>${sb.esc(r['対応予定日'])||'–'}</td>
        <td>${r['停止時間min']??'–'}</td>
        <td>${r['逸失電力kwh']??'–'}</td>
        <td>${(r['添付数']||0)>0?('📎'+r['添付数']):'–'}</td>
        <td>${r['起票日時_jst']?String(r['起票日時_jst']).replace('T',' ').slice(5,16):'–'}</td>
      </tr>`).join('');
    }

    sb.requireLogin({ onReady: load });
  </script>
</body>
</html>
