<!DOCTYPE html>




<html lang="ja">




<head>




<meta charset="UTF-8">




<meta name="viewport" content="width=device-width, initial-scale=1.0">




<title>阿武隈OS — 承認待ち一覧（ライブ）</title>




<style>




  :root{




    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d; --txt:#c9d1d9; --muted:#8b949e;




    --master:#58a6ff; --insp:#3fb950; --defect:#f85149; --work:#d29922; --legal:#db61a2; --ai:#ff7b72;




  }




  *{box-sizing:border-box;margin:0;padding:0}




  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.55}




  a{color:var(--master);text-decoration:none}




  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11161d,#0d1117)}




  .topbar .mark{width:34px;height:34px;border-radius:7px;background:#d6a84f;color:#1b1300;font-weight:900;display:grid;place-items:center;font-size:13px}




  .topbar h1{font-size:16px;color:#fff;font-weight:700}




  .topbar .sub{font-size:11.5px;color:var(--muted)}




  .topbar .back{margin-left:auto;font-size:13px;color:var(--master)}




  .wrap{padding:18px 22px 50px}




  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}




  .filters button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}




  .filters button.active{color:#fff;border-color:var(--master);background:rgba(88,166,255,.1)}




  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}




  .acard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px}




  .acard.wo{border-left:4px solid var(--work)} .acard.ptw{border-left:4px solid var(--legal)} .acard.insp{border-left:4px solid var(--insp)}




  .acard .lbl{font-size:11px;color:var(--muted);margin-bottom:4px}




  .acard h3{font-size:15px;color:#fff;margin-bottom:6px}




  .acard .meta{font-size:12px;color:var(--muted);margin-bottom:4px}




  .acard .no{font-family:monospace;font-size:11.5px;color:var(--master)}




  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}




  .b{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}




  .b-critical,.b-urgent{color:#ff9a92;border-color:var(--defect);background:rgba(248,81,73,.12)}




  .b-high{color:#f0c674;border-color:var(--work);background:rgba(210,153,34,.12)}




  .b-medium,.b-normal{color:#9cd2ff;border-color:var(--master);background:rgba(88,166,255,.12)}




  .b-low{color:var(--muted);border-color:var(--line)}




  .cmt{width:100%;margin-top:10px;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:8px;font-size:12.5px;font-family:inherit;min-height:46px;resize:vertical}




  .cmt:focus{outline:none;border-color:var(--master)}




  .actions{display:flex;gap:8px;margin-top:10px}




  .actions button{flex:1;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:700;cursor:pointer}




  .btn-ok{background:var(--insp);color:#04210d}




  .btn-rev{background:transparent;border:1px solid var(--work)!important;color:#f0c674}




  .actions button:disabled{opacity:.5;cursor:default}




  .done{font-size:13px;font-weight:700;padding:8px 0;text-align:center}




  .done.ok{color:#7ee787} .done.rev{color:#f0c674}




  .loading{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}




  .empty{color:var(--muted);font-size:14px;padding:40px 0;text-align:center}




  .err{color:#ff9a92;font-size:13px;padding:14px;border:1px solid var(--defect);border-radius:8px;background:rgba(248,81,73,.07);margin:18px 0}




  .note{font-size:12px;color:var(--muted);margin-bottom:14px}




</style>




</head>




<body>




<nav id="omFlowBar" aria-label="業務フローステータスバー" style="background:linear-gradient(180deg,#11161d,#0d1117);border-bottom:1px solid #30363d;padding:14px 18px 12px;font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;"><span style="display:flex;flex-direction:column;line-height:1.15;border-left:3px solid rgb(210,153,34);padding-left:9px;flex:0 0 auto;"><b style="color:#e6edf3;font-size:12.5px;font-weight:800;letter-spacing:.04em;">業務フロー</b><span style="color:#6e7681;font-size:10px;">現在地</span></span><span style="display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;color:rgb(210,153,34);background:rgba(210,153,34,.13);border:1px solid rgba(210,153,34,.45);">🟠 異常〜作業フェーズ</span><span style="flex:1 1 auto;"></span><span style="flex:0 0 auto;color:#8b949e;font-size:11px;font-weight:700;">8 / 11</span><span style="flex:0 0 auto;display:inline-block;width:120px;max-width:30vw;height:5px;border-radius:999px;background:#30363d;overflow:hidden;"><span style="display:block;height:100%;width:70%;border-radius:999px;background:rgb(210,153,34);"></span></span></div><div style="display:flex;align-items:flex-start;flex-wrap:wrap;row-gap:6px;"><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./index.html" title="今日の管制塔（完了・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#238636;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid #238636;box-sizing:border-box;">✓</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#8b949e;font-weight:600;max-width:78px;word-break:break-word;">今日の管制塔</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#238636;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./live-board.html" title="監視（完了・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#238636;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid #238636;box-sizing:border-box;">✓</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#8b949e;font-weight:600;max-width:78px;word-break:break-word;">監視</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#238636;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./inspection-plan.html" title="点検計画（完了・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#238636;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid #238636;box-sizing:border-box;">✓</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#8b949e;font-weight:600;max-width:78px;word-break:break-word;">点検計画</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#238636;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./inspection-input.html" title="点検実施（完了・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#238636;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid #238636;box-sizing:border-box;">✓</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#8b9 ;font-weight:800;border:2px solid #238636;box-sizing:border-box;">✓</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#8b949e;font-weight:600;max-width:78px;word-break:break-word;">PTW/KY</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#238636;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><div title="現在この画面です" aria-current="step" style="display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:rgb(210,153,34);color:#11161d;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:800;border:2px solid rgb(210,153,34);box-shadow:0 0 0 4px rgba(210,153,34,.22);box-sizing:border-box;">8</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#fff;font-weight:800;max-width:78px;word-break:break-word;">承認</span></div></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./work-execution.html" title="作業実施（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">9</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">作業実施</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./restoration.html" title="復旧確認（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">10</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">復旧確認</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./closeout.html" title="クローズ・報告確認（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">11</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">クローズ・報告確認</span></a></div></div></nav>

  <div class="wrap">




    <div class="note">作業票・作業許可(PTW)・点検実績の承認待ちを一覧表示します。承認/差戻しは <code>approvals</code> に記録され、元レコードの状態を更新します。</div>




    <div class="filters" id="filters">




      <button data-f="all" class="active">すべて</button>




      <button data-f="work_order">作業票</button>




      <button data-f="work_permit">作業許可</button>




      <button data-f="inspection_result">点検実績</button>
      <button data-f="inspection_plan">点検計画</button>
      <button data-f="defect_finding">異常判断</button>

    <div id="body" class="loading">読み込み中…</div>

    <!-- 主任確認セクション Step 10-11 -->
    <div id="chiefSection" style="margin-top:32px;padding-top:24px;border-top:1px solid #30363d;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
        <span style="font-size:14px;font-weight:700;color:#fff;">🩺 主任確認 — 復旧・クローズ（Step 10–11）</span>
        <span id="chiefBadge" style="font-size:11px;background:rgba(219,97,162,.12);color:#db61a2;border:1px solid rgba(219,97,162,.4);border-radius:999px;padding:2px 9px;"></span>
        <button onclick="loadChief()" style="margin-left:auto;background:#1c2128;border:1px solid #30363d;color:#8b949e;font-size:12px;padding:5px 12px;border-radius:7px;cursor:pointer;">↻ 更新</button>

  <script src="./lib/supabase.js"></script>




  <script>




    const esc = sb.esc;




    const state = { rows: [], wtgMap: {}, userId: null, filter: "all", processed: {} };









    const typeClass = { work_order:"wo", work_permit:"ptw", inspection_result:"insp", inspection_plan:"plan", defect_finding:"defect", near_miss:"nm", moc:"moc", permit:"ptw" };
    function _apprTypeColor(t){
      return ({ work_order:"#d29922", work_permit:"#db61a2", permit:"#db61a2", inspection_result:"#3fb950",
        inspection_plan:"#58a6ff", defect_finding:"#f85149", near_miss:"#e3b341", moc:"#bc8cff" })[t] || "#8b949e";
    }

    // 申請内容（元レコード）の表示用ラベル
    const _APPR_LABELS = {
      finding_title:"異常タイトル", finding_detail:"詳細", safety_impact:"安全影響", operation_impact:"運転影響",
      initial_judgement:"一次判定", regulation_impact:"保安規定影響", cause_clarity:"原因明確度", recurrence_type:"再発性",
      severity:"深刻度", first_check_person:"一次確認者", first_check_method:"一次確認方法", first_check_notes:"一次確認メモ",
      legal_judgement_class:"法令分類", report_required_flag:"報告要否",
      result_status:"結果", has_anomaly:"異常有無", anomaly_description:"異常内容", comments:"コメント",
      executed_date:"実施日", weather:"天候", wind_speed_ms:"風速(m/s)", ptw_number:"PTW番号",
      work_type:"作業種別", planned_date:"予定日", inspection_purpose:"点検目的", inspection_scope:"点検範囲",
      notes:"備考", responsible_person:"責任者", worker_count:"作業人数", required_qualification:"必要資格",
      plan_no:"計画番号", work_order_no:"作業票番号", title:"件名", description:"内容", work_description:"作業内容",
      permit_status:"許可状態", valid_from:"有効開始", valid_to:"有効終了", estimated_outage_minutes:"想定停止(分)"
    };
    function _apprFmtVal(k,v){
      if(typeof v === "boolean") return v ? "はい" : "いいえ";
      return esc(String(v));
    }
    const _apprDetLoaded = {};
    async function toggleApprovalDetail(recId, t){
      const el = document.getElementById("det_"+recId);
      if(!el) return;
      const show = el.style.display === "none" || !el.style.display;
      el.style.display = show ? "block" : "none";
      if(!show || _apprDetLoaded[recId]) return;
      _apprDetLoaded[recId] = true;
      el.innerHTML = '<div style="margin-top:8px;color:#8b949e;font-size:12px;">読み込み中…</div>';
      const cfg = patchTarget[t];
      if(!cfg){ el.innerHTML = '<div style="margin-top:8px;color:#8b949e;font-size:12px;">この種別は申請内容の表示に未対応です。</div>'; return; }
      try{
        const rows = await sb.get(`${cfg.table}?id=eq.${encodeURIComponent(recId)}&select=*`);
        const d = rows && rows[0];
        if(!d){ el.innerHTML = '<div style="margin-top:8px;color:#8b949e;font-size:12px;">申請内容が取得できませんでした。</div>'; return; }
        const skip = /(^id$|_id$|_at$|^created|^updated|^revision|^approval_status$|^source_type$|^status$)/;
        const items = Object.keys(d)
          .filter(k => !skip.test(k) && d[k] !== null && d[k] !== "")
          .map(k => `<div style="display:flex;gap:10px;padding:4px 0;border-bottom:1px solid #21262d;">
              <span style="min-width:110px;color:#8b949e;font-size:11.5px;">${esc(_APPR_LABELS[k]||k)}</span>
              <span style="font-size:12.5px;color:#c9d1d9;white-space:pre-wrap;">${_apprFmtVal(k,d[k])}</span>
            </div>`).join("");
        el.innerHTML = `<div style="margin-top:8px;padding:11px 13px;background:#0d1117;border:1px solid #30363d;border-radius:9px;">
            <div style="font-size:11.5px;font-weight:700;color:#9cd2ff;margin-bottom:7px;">📄 申請内容</div>
            ${items || '<span style="color:#8b949e;font-size:12px;">表示できる項目がありません。</span>'}
          </div>`;
      }catch(e){
        el.innerHTML = '<div style="margin-top:8px;color:#f85149;font-size:12px;">取得エラー: '+esc(e.message)+'</div>';
      }
    }




    const patchTarget = {
      work_order:       { table:"work_orders",         approve:{status:"in_progress", approval_status:"approved"}, revise:{status:"open",             approval_status:"returned"} },
      work_permit:      { table:"work_permits",         approve:{permit_status:"approved"}, revise:{permit_status:"rejected"} },
      permit:           { table:"work_permits",         approve:{permit_status:"approved"}, revise:{permit_status:"rejected"} },
      inspection_result:{ table:"inspection_results",  approve:{approval_status:"approved"},                        revise:{approval_status:"returned"} },
      defect_finding:   { table:"defect_findings",      approve:{status:"assessed", approval_status:"approved"},   revise:{approval_status:"returned"} },
      inspection_plan:  { table:"inspection_plans",     approve:{approval_status:"approved"},                     revise:{approval_status:"returned"} },
    };









    async function getUserId(){




      const res = await fetch(`${sb.URL}/auth/v1/user`, { headers: sb.headers() });




      if(!res.ok) return null;




      const u = await res.json();




      return u.id || null;




    }









    function render(){




      const body = document.getElementById("body");




      let rows = state.rows.slice();




      if(state.filter !== "all") rows = rows.filter(r => r["種別"] === state.filter);




      if(!rows.length){ body.innerHTML = '<div class="empty">承認待ちの項目はありません 🎉</div>'; return; }




      body.innerHTML = '<div class="cards">' + rows.map(r => {




        const id = r["レコードid"], t = r["種別"];




        const wtg = state.wtgMap[r["風車id"]] || "—";




        const sev = (r["重要度"]||"").toLowerCase(), pri = (r["優先度"]||"").toLowerCase();




        const pr = state.processed[id];




        let foot;




        if(pr === "approved") foot = '<div class="done ok">✅ 承認しました（差戻し不可）</div>';




        else if(pr === "revised") foot = '<div class="done rev">↩ 差戻ししました</div>';




        else {
          // approval_status が pending のときのみ差戻し可
          const curStatus = r["approval_status"] || "pending";
          const canRevise = (curStatus === "pending" || curStatus === "submitted" || curStatus === "open");
          foot = `<textarea class="cmt" data-id="${esc(id)}" placeholder="コメント（任意・証跡に記録されます）"></textarea>
          <div class="actions">
            <button class="btn-ok" data-id="${esc(id)}" data-act="approve">✅ 承認</button>
            ${canRevise ? `<button class="btn-rev" data-id="${esc(id)}" data-act="revise">↩ 差戻し</button>` : ''}
          </div>`;
        }




        return `<div class="acard ${typeClass[t]||''}" data-card="${esc(id)}">




          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px;">
            <span onclick="toggleApprovalDetail('${esc(id)}','${esc(t)}')" title="クリックで申請内容を表示" style="cursor:pointer;font-size:15px;font-weight:800;padding:6px 13px;border-radius:9px;white-space:nowrap;color:${_apprTypeColor(t)};background:${_apprTypeColor(t)}22;border:1px solid ${_apprTypeColor(t)}66;">${esc(r["表示ラベル"]||t)} <span style="font-size:12px;">▾</span></span>
            <span style="font-size:17px;font-weight:800;padding:6px 13px;border-radius:9px;white-space:nowrap;color:#fff;background:#1c2128;border:1px solid #30363d;font-family:monospace;">🌀 ${esc(wtg)}</span>
          </div>




          <h3>${esc(r["内容"]||"(内容なし)")}</h3>

          <div id="det_${esc(id)}" style="display:none;"></div>




          <div class="meta no">${esc(r["番号"]||"")}</div>




          <div class="badges">




            ${sev?`<span class="b b-${esc(sev)}">重要度 ${esc(r["重要度"])}</span>`:""}




            ${pri?`<span class="b b-${esc(pri)}">優先度 ${esc(r["優先度"])}</span>`:""}




            ${r["必要ロール"]?`<span class="b b-medium">承認権限 ${esc(r["必要ロール"])}</span>`:""}




          </div>




          <div class="meta">申請 ${esc(r["申請日時_jst"]||"")}</div>




          ${foot}




        </div>`;




      }).join("") + '</div>';




      body.querySelectorAll(".actions button").forEach(btn =>




        btn.addEventListener("click", () => doAction(btn.dataset.id, btn.dataset.act, btn)));




    }









    async function doAction(recId, act, btn){




      const row = state.rows.find(r => r["レコードid"] === recId);




      if(!row) return;




      const t = row["種別"];




      const card = btn.closest(".acard");




      const cmtEl = card.querySelector(".cmt");




      const userComment = cmtEl ? cmtEl.value.trim() : "";




      if(act === "revise" && !userComment){




        alert("差戻しの場合はコメント（修正理由）を入力してください。");




        return;




      }




      card.querySelectorAll("button,textarea").forEach(b => b.disabled = true);




      try{




        if(!state.userId) state.userId = await getUserId();




        await sb.write("POST", "approvals", {




          target_type: t, target_id: recId,




          action: act === "approve" ? "approved" : "requested_revision",




          reviewed_by: state.userId,




          comment: userComment || (act === "approve" ? "承認" : "差戻し（要修正）")




        });




        const cfg = patchTarget[t];




        const patch = act === "approve" ? cfg.approve : cfg.revise;




        if(cfg && patch && Object.keys(patch).length){




          await sb.write("PATCH", `${cfg.table}?id=eq.${encodeURIComponent(recId)}`, patch);




        }




        state.processed[recId] = act === "approve" ? "approved" : "revised";




        render();




      }catch(e){




        card.querySelectorAll("button,textarea").forEach(b => b.disabled = false);




        alert("処理に失敗しました: " + e.message);




      }




    }









    document.querySelectorAll("#filters button").forEach(btn =>




      btn.addEventListener("click", () => {




        document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));




        btn.classList.add("active");




        state.filter = btn.dataset.f;




        render();




      }));









    /* ===== 主任確認セクション（Step 10-11 復旧・クローズ） ===== */
    const CHIEF_ST = {
      pending:      {label:'🔴 未確認',   color:'#f85149', bg:'rgba(248,81,73,.12)',  bd:'rgba(248,81,73,.35)'},
      confirmed:    {label:'✅ 確認済み', color:'#3fb950', bg:'rgba(63,185,80,.12)',  bd:'rgba(63,185,80,.35)'},
      rejected:     {label:'↩ 差戻し',    color:'#d29922', bg:'rgba(210,153,34,.12)', bd:'rgba(210,153,34,.4)'},
      not_required: {label:'—',           color:'#8b949e', bg:'transparent',          bd:'transparent'},
      open:         {label:'🔴 未確認',   color:'#f85149', bg:'rgba(248,81,73,.12)',  bd:'rgba(248,81,73,.35)'},
      in_review:    {label:'🟡 確認中',   color:'#d29922', bg:'rgba(210,153,34,.12)', bd:'rgba(210,153,34,.4)'},
      returned:     {label:'↩ 差戻し',    color:'#d29922', bg:'rgba(210,153,34,.12)', bd:'rgba(210,153,34,.4)'},
      closed:       {label:'✅ 確認済み', color:'#3fb950', bg:'rgba(63,185,80,.12)',  bd:'rgba(63,185,80,.35)'}
    };
    function chiefBadge(st){
      const s=CHIEF_ST[st]||{label:st||'—',color:'#8b949e',bg:'transparent',bd:'transparent'};
      return `<span style="font-size:11px;font-weight:700;color:${s.color};background:${s.bg};border:1px solid ${s.bd};border-radius:6px;padding:2px 8px;white-space:nowrap;">${s.label}</span>`;
    }

    async function loadChief(){
      const el=document.getElementById('chiefBody'), badge=document.getElementById('chiefBadge');
      if(!el) return;
      el.innerHTML='<div style="color:#8b949e;font-size:13px;padding:20px 0;">読み込み中…</div>';
      try{
        const [rests,closes]=await Promise.all([
          sb.get('restoration_checks?chief_review_status=eq.pending&select=*&order=created_at.desc'),
          sb.get('closeout_reviews?review_status=in.(open,in_review,returned)&select=*&order=created_at.desc')
        ]);
        const ar=rests||[], ac=closes||[];
        const total=ar.length+ac.length;
        if(badge) badge.textContent=total>0?`未確認 ${total}件`:'全件確認済み';

        // work_order_no を一括取得
        const woIds=[...new Set([...ar.map(r=>r.work_order_id),...ac.map(c=>c.work_order_id)].filter(Boolean))];
        const woMap={};
        if(woIds.length){
          const wos=await sb.get(`work_orders?id=in.(${woIds.join(',')})&select=id,work_order_no,turbine_id`).catch(()=>[]);
          (wos||[]).forEach(w=>{woMap[w.id]={no:w.work_order_no||'—',tid:w.turbine_id};});
        }
        renderChiefTable(ar,ac,woMap);
      }catch(e){
        if(el) el.innerHTML=`<div style="color:#f85149;font-size:13px;padding:14px;border:1px solid rgba(248,81,73,.3);border-radius:8px;background:rgba(248,81,73,.07);">取得エラー: ${esc(e.message)}</div>`;
      }
    }

    function renderChiefTable(rests,closes,woMap){
      const el=document.getElementById('chiefBody');
      if(!rests.length&&!closes.length){
        el.innerHTML='<div style="color:#7ee787;font-size:13px;padding:20px 0;">✅ 未確認の復旧確認・クローズはありません</div>';
        return;
      }
      const th=s=>`<th style="padding:7px 8px;text-align:left;color:#8b949e;font-size:11px;border-bottom:1px solid #30363d;font-weight:700;">${s}</th>`;
      const td=s=>`<td style="padding:7px 8px;vertical-align:middle;border-bottom:1px solid #21262d;">${s}</td>`;
      const wtgLabel=tid=>esc(state.wtgMap[tid]||'—');

      const restRows=rests.map(r=>{
        const wo=woMap[r.work_order_id]||{};
        const woNo=wo.no||r.work_order_id||'—';
        return `<tr>
          ${td(`<a href="./restoration.html?work_order_id=${esc(r.work_order_id)}" style="color:#58a6ff;font-family:monospace;font-size:11.5px;">${esc(woNo)}</a>`)}
          ${td(`<span style="font-size:12px;">${wtgLabel(r.turbine_id)}</span>`)}
          ${td('<span style="font-size:11px;background:rgba(63,185,80,.12);color:#3fb950;border:1px solid rgba(63,185,80,.35);border-radius:6px;padding:2px 7px;">復旧確認</span>')}
          ${td(chiefBadge(r.chief_review_status||'pending'))}
          ${td(`<span style="font-size:11.5px;">${esc(r.restoration_status||'—')}</span>`)}
          ${td(`<span style="font-size:11.5px;">${esc(r.chief_reviewer||'—')}</span>`)}
          ${td(`<span style="font-size:11px;color:#8b949e;">${r.chief_reviewed_at?String(r.chief_reviewed_at).slice(5,16):'—'}</span>`)}
          ${td(`<div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button onclick="updateChief('restoration_checks','${esc(r.id)}','confirmed')" style="font-size:11px;padding:3px 9px;background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.4);border-radius:5px;cursor:pointer;">✅ 確認済み</button>
            <button onclick="updateChief('restoration_checks','${esc(r.id)}','rejected')" style="font-size:11px;padding:3px 9px;background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.35);border-radius:5px;cursor:pointer;">↩ 差戻し</button>
          </div>`)}
        </tr>`;}).join('');

      const closeRows=closes.map(c=>{
        const wo=woMap[c.work_order_id]||{};
        const woNo=wo.no||c.work_order_id||'—';
        const st=c.review_status||'open';
        return `<tr>
          ${td(`<a href="./closeout.html?work_order_id=${esc(c.work_order_id)}" style="color:#58a6ff;font-family:monospace;font-size:11.5px;">${esc(woNo)}</a>`)}
          ${td(`<span style="font-size:12px;">${wtgLabel(wo.tid)}</span>`)}
          ${td('<span style="font-size:11px;background:rgba(219,97,162,.12);color:#db61a2;border:1px solid rgba(219,97,162,.35);border-radius:6px;padding:2px 7px;">クローズ</span>')}
          ${td(chiefBadge(st))}
          ${td(`<span style="font-size:11.5px;">${esc(c.report_type||'—')}</span>`)}
          ${td(`<span style="font-size:11.5px;">${esc(c.reviewed_by||'—')}</span>`)}
          ${td(`<span style="font-size:11px;color:#8b949e;">${c.updated_at?String(c.updated_at).slice(5,16):'—'}</span>`)}
          ${td(`<div style="display:flex;gap:5px;flex-wrap:wrap;">
            ${st==='open'?`<button onclick="updateChief('closeout_reviews','${esc(c.id)}','in_review')" style="font-size:11px;padding:3px 9px;background:rgba(210,153,34,.15);color:#d29922;border:1px solid rgba(210,153,34,.4);border-radius:5px;cursor:pointer;">🟡 承認済み</button>`:''}
            <button onclick="updateChief('closeout_reviews','${esc(c.id)}','closed')" style="font-size:11px;padding:3px 9px;background:rgba(63,185,80,.15);color:#3fb950;border:1px solid rgba(63,185,80,.4);border-radius:5px;cursor:pointer;">✅ 確認済み</button>
            <button onclick="updateChief('closeout_reviews','${esc(c.id)}','returned')" style="font-size:11px;padding:3px 9px;background:rgba(248,81,73,.1);color:#f85149;border:1px solid rgba(248,81,73,.35);border-radius:5px;cursor:pointer;">↩ 差戻し</button>
          </div>`)}
        </tr>`;}).join('');

      el.innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:12px;background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;">
        <thead style="background:#1c2128;"><tr>${['作業票','風車','種別','ステータス','状態','確認者','確認日時','操作'].map(th).join('')}</tr></thead>
        <tbody>${restRows}${closeRows}</tbody>
      </table>`;
    }

    async function updateChief(tbl,id,newStatus){
      try{
        if(!state.userId) state.userId=await getUserId();
        const now=new Date().toISOString();
        const patch=tbl==='restoration_checks'
          ?{chief_review_status:newStatus,chief_reviewer:state.userId,chief_reviewed_at:now}
          :{review_status:newStatus,reviewed_by:state.userId,updated_at:now};
        const res=await fetch(`${sb.URL}/rest/v1/${tbl}?id=eq.${encodeURIComponent(id)}`,
          {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),
           body:JSON.stringify(patch)});
        if(!res.ok){const t=await res.text();throw new Error(t||res.status);}
        await loadChief();
      }catch(e){alert('更新失敗: '+e.message);}
    }

    async function loadAll(){




      try{




        const [rows, turbines] = await Promise.all([




          sb.get("v_approvals_pending_all?order=申請日時_jst.desc"),




          sb.get("turbines?select=id,turbine_no")




        ]);




        state.rows = rows;




        turbines.forEach(t => state.wtgMap[t.id] = t.turbine_no);




        render();
        loadChief();




      }catch(e){




        document.getElementById("body").innerHTML = '<div class="err">データ取得に失敗しました: ' + esc(e.message) + '</div>';




      }




    }




    sb.requireLogin({ onReady: loadAll });




  </script>




</body>




</html>
