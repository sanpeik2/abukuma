<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿武隈OS — タービン / アラーム / 点検カレンダー（ライブ）</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d; --txt:#c9d1d9; --muted:#8b949e;
    --master:#58a6ff; --insp:#3fb950; --defect:#f85149; --work:#d29922; --legal:#db61a2; --ai:#ff7b72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.55}
  a{color:var(--master);text-decoration:none}

  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11161d,#0d1117)}
  .topbar .mark{width:34px;height:34px;border-radius:7px;background:#d6a84f;color:#1b1300;font-weight:900;display:grid;place-items:center;font-size:13px}
  .topbar h1{font-size:16px;color:#fff;font-weight:700}
  .topbar .sub{font-size:11.5px;color:var(--muted)}
  .topbar .back{margin-left:auto;font-size:13px;color:var(--master)}

  .tabs{display:flex;gap:8px;padding:12px 22px 0;border-bottom:1px solid var(--line)}
  .tabs button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:14px;font-weight:600;padding:9px 14px 12px;cursor:pointer}
  .tabs button.active{color:#fff;border-bottom-color:var(--master)}
  .tabs .count{font-size:11px;color:var(--muted);margin-left:6px}

  .view{display:none;padding:18px 22px 40px}
  .view.active{display:block}

  /* ---- turbine master-detail ---- */
  .turb-wrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,420px);gap:18px;align-items:start}
  .turb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;max-height:72vh;overflow:auto;padding-right:4px}
  .tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;transition:border-color .12s,transform .12s}
  .tcard:hover{transform:translateY(-2px)}
  .tcard.sel{border-color:var(--master);box-shadow:0 0 0 1px var(--master)}
  .tcard .id{font-size:13px;color:#fff;font-weight:700;display:flex;align-items:center;gap:6px}
  .tcard .kw{font-size:11px;color:var(--muted);margin-top:3px}
  .sdot{width:9px;height:9px;border-radius:50%;flex:none}
  .s-normal{background:var(--insp)} .s-warn{background:var(--work)} .s-stop{background:var(--defect)} .s-inspect{background:var(--master)}

  .detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;position:sticky;top:16px}
  .detail .dhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .detail .dhead h2{font-size:20px;color:#fff}
  .pill{font-size:11px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid}
  .p-normal{color:#7ee787;border-color:var(--insp);background:rgba(63,185,80,.12)}
  .p-warn{color:#f0c674;border-color:var(--work);background:rgba(210,153,34,.12)}
  .p-stop{color:#ff9a92;border-color:var(--defect);background:rgba(248,81,73,.12)}
  .p-inspect{color:#9cd2ff;border-color:var(--master);background:rgba(88,166,255,.12)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .metric .l{font-size:11px;color:var(--muted)}
  .metric .v{font-size:19px;color:#fff;font-weight:700;margin-top:2px}
  .metric .v small{font-size:12px;color:var(--muted);font-weight:400}
  .dsec{font-size:12px;color:var(--muted);font-weight:700;margin:16px 0 7px;text-transform:uppercase;letter-spacing:.04em}
  .drow{font-size:12.5px;padding:7px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-start}
  .drow:first-of-type{border-top:none}
  .dempty{font-size:12px;color:var(--muted);padding:6px 0}

  /* ---- alarms table ---- */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--bg)}
  tr.ongoing{background:rgba(248,81,73,.05)}
  .sev{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}
  .sev-critical{color:#ff9a92;border-color:var(--defect);background:rgba(248,81,73,.12)}
  .sev-warning{color:#f0c674;border-color:var(--work);background:rgba(210,153,34,.12)}
  .sev-info{color:#9cd2ff;border-color:var(--master);background:rgba(88,166,255,.12)}
  .tag-open{color:#ff9a92;font-weight:700} .tag-done{color:#7ee787}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .filters button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}
  .filters button.active{color:#fff;border-color:var(--master);background:rgba(88,166,255,.1)}

  /* ---- inspection calendar ---- */
  .cal-month{margin-bottom:26px}
  .cal-month h3{font-size:15px;color:#fff;margin-bottom:10px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
  .cal .day{min-height:86px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 7px;overflow:hidden}
  .cal .day.empty{background:transparent;border:none}
  .cal .day.today{border-color:var(--master);box-shadow:0 0 0 1px var(--master)}
  .cal .dnum{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}
  .cal .day.today .dnum{color:var(--master)}
  .chip{font-size:10.5px;padding:2px 5px;border-radius:5px;margin-bottom:3px;border-left:3px solid;background:var(--panel2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .c-planned{border-color:var(--master)} .c-in_progress{border-color:var(--work)} .c-done{border-color:var(--insp);opacity:.6} .c-cancelled{border-color:var(--muted);opacity:.45;text-decoration:line-through}
  .cal-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .lg{width:10px;height:10px;border-radius:2px;display:inline-block}

  .loading{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
  .err{color:#ff9a92;font-size:13px;padding:14px;border:1px solid var(--defect);border-radius:8px;background:rgba(248,81,73,.07);margin:18px 0}
  @media(max-width:780px){.turb-wrap{grid-template-columns:1fr}.detail{position:static}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="mark">AW</div>
    <div>
      <h1>タービン / アラーム / 点検カレンダー</h1>
      <div class="sub">阿武隈OS ライブ盤 — Supabase連携</div>
    </div>
    <a class="back" href="./menu.html">≡ メニューへ戻る</a>
  </div>

  <div class="tabs">
    <button data-tab="turb" class="active">🌀 タービン一覧<span class="count" id="cTurb"></span></button>
    <button data-tab="alarm">🚨 アラーム一覧<span class="count" id="cAlarm"></span></button>
    <button data-tab="cal">📅 点検カレンダー<span class="count" id="cCal"></span></button>
  </div>

  <section id="view-turb" class="view active">
    <div id="turbBody" class="loading">読み込み中…</div>
  </section>
  <section id="view-alarm" class="view">
    <div class="filters" id="alarmFilters">
      <button data-f="all" class="active">すべて</button>
      <button data-f="open">未解決のみ</button>
      <button data-f="critical">重大</button>
      <button data-f="warning">警告</button>
    </div>
    <div id="alarmBody" class="loading">読み込み中…</div>
  </section>
  <section id="view-cal" class="view">
    <div class="cal-legend">
      <span><i class="lg" style="background:var(--master)"></i>予定</span>
      <span><i class="lg" style="background:var(--work)"></i>実施中</span>
      <span><i class="lg" style="background:var(--insp)"></i>完了</span>
      <span><i class="lg" style="background:var(--muted)"></i>中止</span>
    </div>
    <div id="calBody" class="loading">読み込み中…</div>
  </section>

  <script src="./lib/supabase.js"></script>
  <script>
    const esc = sb.esc;
    const TODAY = "2026-05-29";
    const state = { wtg: [], alarms: [], insp: [], sel: null, alarmFilter: "all" };

    const statusLabel = { normal:"正常", warn:"警告", stop:"停止", inspect:"点検中" };
    const inspStatusLabel = { planned:"予定", in_progress:"実施中", done:"完了", cancelled:"中止" };
    const sevLabel = { critical:"重大", warning:"警告", info:"情報" };

    function fmtTime(t){ return t ? t.slice(0,5) : ""; }
    function fmtDT(s){ return sb.fmtDateTime(s); }

    /* ---------- TURBINES ---------- */
    function renderTurbines(){
      const body = document.getElementById("turbBody");
      if(!state.wtg.length){ body.innerHTML = '<div class="dempty">タービンデータがありません。</div>'; return; }
      const cards = state.wtg.map(t => {
        const st = t.status || "normal";
        return `<div class="tcard${state.sel===t.wtg_id?' sel':''}" data-id="${esc(t.wtg_id)}">
          <div class="id"><span class="sdot s-${esc(st)}"></span>${esc(t.wtg_id)}</div>
          <div class="kw">${t.output_kw!=null?Math.round(t.output_kw)+" kW":"–"}</div>
        </div>`;
      }).join("");
      body.innerHTML = `<div class="turb-wrap">
        <div class="turb-grid">${cards}</div>
        <div class="detail" id="turbDetail"></div>
      </div>`;
      body.querySelectorAll(".tcard").forEach(c =>
        c.addEventListener("click", () => { state.sel = c.dataset.id; renderTurbines(); }));
      renderTurbineDetail();
    }
    function renderTurbineDetail(){
      const box = document.getElementById("turbDetail");
      if(!box) return;
      if(!state.sel){ box.innerHTML = '<div class="dempty">← 一覧からタービンを選択してください。</div>'; return; }
      const t = state.wtg.find(x => x.wtg_id === state.sel);
      if(!t){ box.innerHTML = '<div class="dempty">該当データなし。</div>'; return; }
      const st = t.status || "normal";
      const al = state.alarms.filter(a => a.wtg_id === t.wtg_id);
      const alOpen = al.filter(a => !a.resolved_at);
      const ins = state.insp.filter(i => i.wtg_id === t.wtg_id);
      const insUpcoming = ins.filter(i => i.date >= TODAY && i.status !== "cancelled");

      const alarmRows = (al.length ? al : []).slice(0,6).map(a =>
        `<div class="drow"><span class="sev sev-${esc(a.severity)}">${sevLabel[a.severity]||esc(a.severity)}</span>
         <div><b>${esc(a.alarm_type)}</b>${a.resolved_at?' <span class="tag-done">解決済</span>':' <span class="tag-open">未解決</span>'}<br>
         <span style="color:var(--muted)">${esc(a.detail||"")}</span></div></div>`).join("") || '<div class="dempty">アラームなし</div>';

      const insRows = (ins.length ? ins : []).slice(0,6).map(i =>
        `<div class="drow"><span style="color:var(--muted);white-space:nowrap">${esc(i.date)}</span>
         <div><b>${esc(i.work_type)}</b> <span style="color:var(--muted)">[${inspStatusLabel[i.status]||esc(i.status)}]</span><br>
         <span style="color:var(--muted)">${fmtTime(i.time_start)}–${fmtTime(i.time_end)} / ${esc(i.required_qualification||"")} / ${i.worker_count||"?"}名</span></div></div>`).join("") || '<div class="dempty">点検予定なし</div>';

      box.innerHTML = `
        <div class="dhead"><span class="sdot s-${esc(st)}"></span><h2>${esc(t.wtg_id)}</h2>
          <span class="pill p-${esc(st)}">${statusLabel[st]||esc(st)}</span></div>
        <div style="font-size:11.5px;color:var(--muted)">最終更新 ${fmtDT(t.updated_at)}</div>
        <div class="metrics">
          <div class="metric"><div class="l">出力</div><div class="v">${t.output_kw!=null?Math.round(t.output_kw):"–"} <small>kW</small></div></div>
          <div class="metric"><div class="l">風速</div><div class="v">${t.wind_speed_ms!=null?t.wind_speed_ms:"–"} <small>m/s</small></div></div>
          <div class="metric"><div class="l">未解決アラーム</div><div class="v">${alOpen.length}<small> 件</small></div></div>
          <div class="metric"><div class="l">今後の点検</div><div class="v">${insUpcoming.length}<small> 件</small></div></div>
        </div>
        ${t.alarm_code?`<div style="font-size:12px;color:#f0c674">アラームコード: ${esc(t.alarm_code)}</div>`:""}
        <div class="dsec">関連アラーム</div>${alarmRows}
        <div class="dsec">点検予定・履歴</div>${insRows}`;
    }

    /* ---------- ALARMS ---------- */
    function renderAlarms(){
      const body = document.getElementById("alarmBody");
      let rows = state.alarms.slice();
      const f = state.alarmFilter;
      if(f==="open") rows = rows.filter(a => !a.resolved_at);
      else if(f==="critical") rows = rows.filter(a => a.severity==="critical");
      else if(f==="warning") rows = rows.filter(a => a.severity==="warning");
      if(!rows.length){ body.innerHTML = '<div class="dempty">該当するアラームはありません。</div>'; return; }
      const trs = rows.map(a => `<tr class="${a.resolved_at?'':'ongoing'}">
        <td><span class="sev sev-${esc(a.severity)}">${sevLabel[a.severity]||esc(a.severity)}</span></td>
        <td><b>${esc(a.wtg_id)}</b></td>
        <td>${esc(a.alarm_type)}</td>
        <td style="color:var(--muted)">${esc(a.detail||"")}</td>
        <td>${esc(a.owner||"–")}</td>
        <td style="white-space:nowrap">${fmtDT(a.started_at)}</td>
        <td>${a.resolved_at?'<span class="tag-done">解決済</span>':'<span class="tag-open">未解決</span>'}</td>
      </tr>`).join("");
      body.innerHTML = `<table><thead><tr>
        <th>重要度</th><th>号機</th><th>種別</th><th>内容</th><th>担当</th><th>発生</th><th>状態</th>
      </tr></thead><tbody>${trs}</tbody></table>`;
    }

    /* ---------- INSPECTION CALENDAR ---------- */
    function renderCalendar(){
      const body = document.getElementById("calBody");
      if(!state.insp.length){ body.innerHTML = '<div class="dempty">点検計画がありません。</div>'; return; }
      const byDate = {};
      state.insp.forEach(i => { (byDate[i.date] = byDate[i.date] || []).push(i); });
      const dates = state.insp.map(i => i.date).sort();
      const first = dates[0], last = dates[dates.length-1];
      const months = monthsBetween(first, last);
      const dows = ["日","月","火","水","木","金","土"];
      body.innerHTML = months.map(m => {
        const y = m.y, mo = m.m;
        const firstDay = new Date(y, mo, 1).getDay();
        const daysIn = new Date(y, mo+1, 0).getDate();
        let cells = "";
        for(let i=0;i<firstDay;i++) cells += '<div class="day empty"></div>';
        for(let d=1; d<=daysIn; d++){
          const ds = `${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
          const items = byDate[ds] || [];
          const chips = items.map(i =>
            `<div class="chip c-${esc(i.status)}" title="${esc(i.wtg_id)} ${esc(i.work_type)} (${inspStatusLabel[i.status]||i.status})">${esc(i.wtg_id)} ${esc(i.work_type)}</div>`).join("");
          cells += `<div class="day${ds===TODAY?' today':''}"><div class="dnum">${d}</div>${chips}</div>`;
        }
        const dowHead = dows.map(w => `<div class="dow">${w}</div>`).join("");
        return `<div class="cal-month"><h3>${y}年${mo+1}月</h3><div class="cal">${dowHead}${cells}</div></div>`;
      }).join("");
    }
    function monthsBetween(a, b){
      const [ay,am] = a.split("-").map(Number);
      const [by,bm] = b.split("-").map(Number);
      const out = []; let y=ay, m=am-1;
      while(y<by || (y===by && m<=bm-1)){ out.push({y,m}); m++; if(m>11){m=0;y++;} }
      return out;
    }

    /* ---------- TABS ---------- */
    document.querySelectorAll(".tabs button").forEach(btn =>
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("view-" + btn.dataset.tab).classList.add("active");
      }));
    document.querySelectorAll("#alarmFilters button").forEach(btn =>
      btn.addEventListener("click", () => {
        document.querySelectorAll("#alarmFilters button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.alarmFilter = btn.dataset.f;
        renderAlarms();
      }));

    /* ---------- LOAD ---------- */
    async function loadAll(){
      try{
        const [wtg, alarms, insp] = await Promise.all([
          sb.get("wtg_status?select=*&order=wtg_id.asc"),
          sb.get("alarm_events?select=*&order=started_at.desc"),
          sb.get("inspection_plan?select=*&order=date.asc,time_start.asc")
        ]);
        state.wtg = wtg; state.alarms = alarms; state.insp = insp;
        state.sel = wtg.length ? wtg[0].wtg_id : null;
        document.getElementById("cTurb").textContent = wtg.length;
        document.getElementById("cAlarm").textContent = alarms.filter(a=>!a.resolved_at).length + "/" + alarms.length;
        document.getElementById("cCal").textContent = insp.length;
        renderTurbines(); renderAlarms(); renderCalendar();
      }catch(e){
        const msg = '<div class="err">データ取得に失敗しました: ' + esc(e.message) + '</div>';
        ["turbBody","alarmBody","calBody"].forEach(id => document.getElementById(id).innerHTML = msg);
      }
    }
    sb.requireLogin({ onReady: loadAll });
  </script>
</body>
</html>
