<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿武隈OS — 復旧確認（ライブ）</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--line:#30363d;--txt:#c9d1d9;--muted:#8b949e;--master:#58a6ff;--ok:#3fb950;--ng:#f85149}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.55}
  a{color:var(--master);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11161d,#0d1117)}
  .topbar .mark{width:34px;height:34px;border-radius:7px;background:#3fb950;color:#06210f;font-weight:900;display:grid;place-items:center;font-size:13px}
  .topbar h1{font-size:17px}.topbar .sub{font-size:11.5px;color:var(--muted)}.topbar .back{margin-left:auto;font-size:13px}
  .wrap{padding:16px 14px 50px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button.r{background:#238636;color:#fff;border:none;font-weight:700;font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
  th{color:var(--muted);font-size:11px;font-weight:700}
  .no a{color:#58a6ff;font-family:monospace;font-size:12px;font-weight:700;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:36px}.badge{font-size:11px;font-weight:700;white-space:nowrap}
  .ctx{margin:0 0 14px;padding:11px 14px;border:1px solid rgba(63,185,80,.4);border-radius:9px;background:rgba(63,185,80,.07);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:none}.ov.open{display:block}
  .pnl{position:fixed;top:0;right:0;width:max(50vw,400px);max-width:100vw;height:100%;background:var(--panel);border-left:1px solid var(--line);z-index:801;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}.pnl.open{transform:none}
  .pnl .hd{display:flex;align-items:center;gap:10px;padding:20px 28px;border-bottom:1px solid var(--line)}
  .pnl .bd{flex:1;overflow:auto;padding:24px}.pnl .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
  .fld{margin-bottom:14px}.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .in{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:9px 12px;border-radius:7px;font-size:15px;font-family:inherit}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bs{background:#1f6feb;color:#fff;font-weight:700;border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}.bc{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer}.bq{background:rgba(63,185,80,.18);color:#3fb950;border:1px solid rgba(63,185,80,.5);font-weight:700;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="topbar"><div class="mark">AW</div><div><h1>復旧確認</h1><div class="sub">阿武隈OS — 設備が正常に戻ったか・発電再開可否の確認（Step 10）</div></div><a class="back" href="./menu.html">≡ メニューへ戻る</a></div>
<style>
  .flow{display:flex;gap:3px;flex-wrap:wrap;align-items:flex-start;padding:9px 14px;border-bottom:1px solid var(--line);background:#0e1320}
  .flow a{display:flex;flex-direction:column;align-items:center;text-decoration:none;min-width:54px;text-align:center}
  .flow .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid #30363d;background:#0d1117;color:#6e7681}
  .flow a.done .dot{background:#238636;border-color:#238636;color:#fff}
  .flow a.cur .dot{background:#3fb950;border-color:#3fb950;color:#06210f;box-shadow:0 0 0 3px rgba(63,185,80,.25)}
  .flow .lb{font-size:9px;margin-top:4px;color:#6e7681;max-width:60px;line-height:1.15}
  .flow a.done .lb,.flow a.cur .lb{color:#c9d1d9}
  .flow .ln{flex:1 1 5px;min-width:4px;height:2px;background:#30363d;border-radius:2px;margin-top:10px}
  .flow .ln.done{background:#238636}
</style>
<div class="flow" id="flow"></div>
<script>(function(){const STEPS=[['今日の管制塔','./index.html'],['監視','./live-board.html'],['点検計画','./inspection-plan.html'],['点検実施','./inspection-input.html'],['異常判断','./defect-rca.html'],['作業票','./work-orders.html'],['PTW/KY/LOTO','./permits.html'],['承認','./approvals.html'],['作業実施','./work-execution.html'],['復旧確認','./restoration.html'],['クローズ','./closeout.html']];const CUR=9;const el=document.getElementById('flow');el.innerHTML=STEPS.map((s,i)=>{const cls=i<CUR?'done':i===CUR?'cur':'';const a=`<a class="${cls}" href="${s[1]}" title="${s[0]}"><span class="dot">${i<CUR?'✓':(i+1)}</span><span class="lb">${s[0]}</span></a>`;return a+(i<STEPS.length-1?`<span class="ln ${i<CUR?'done':''}"></span>`:'');}).join('');})();</script>
<div class="wrap">
  <div id="ctxBanner"></div>
  <div class="bar"><button class="r" onclick="openEdit('')">＋ 復旧確認を記録</button><span id="cnt" style="color:var(--muted);font-size:12px"></span></div>
  <div id="body"><div class="empty">読み込み中…</div></div>
</div>
<div class="ov" id="ov" onclick="closeEdit()"></div>
<div class="pnl" id="pnl"><div class="hd"><h3 id="pnlTitle" style="font-size:17px;color:#fff;flex:1">復旧確認</h3><button class="bc" onclick="closeEdit()">✕</button></div><div class="bd" id="pnlBody"></div><div class="ft" id="pnlFt"></div></div>

<script src="./lib/supabase.js"></script>
<script>
const esc=s=>sb.esc(s==null?'':String(s));
const WO_ID=new URLSearchParams(location.search).get('work_order_id');
let ALL=[], WO_CTX=null;
function woNav(cur){
  if(!WO_ID) return '';
  const q='?work_order_id='+encodeURIComponent(WO_ID);
  const L=[
    ['ptw',  './ky-loto.html'+q,        '🔒 PTW/KY/LOTO','#e3b341','rgba(210,153,34,.12)','rgba(210,153,34,.4)'],
    ['exec', './work-execution.html'+q, '🔧 作業実施',    '#d29922','rgba(210,153,34,.12)','rgba(210,153,34,.4)'],
    ['rest', './restoration.html'+q,    '✅ 復旧確認',     '#3fb950','rgba(63,185,80,.12)','rgba(63,185,80,.4)'],
    ['close','./closeout.html'+q,       '🩷 クローズ',     '#db61a2','rgba(219,97,162,.12)','rgba(219,97,162,.4)']
  ].filter(x=>x[0]!==cur);
  return L.map(x=>`<a href="${x[1]}" style="font-size:11px;font-weight:700;color:${x[3]};background:${x[4]};border:1px solid ${x[5]};border-radius:6px;padding:4px 9px;text-decoration:none;white-space:nowrap">${x[2]}</a>`).join('')
    + '<a href="./work-orders.html" style="font-size:12px;color:#58a6ff;text-decoration:none">← 作業票</a>';
}
const OPT={
  restoration_status:[['pending','⏳ 確認中'],['restored','✅ 復旧済'],['rework','🔁 再作業'],['not_restored','🔴 復旧不可']],
  trial_run_status:[['','—'],['good','✅ 良好'],['recheck','🟡 要再確認'],['ng','🔴 NG']],
  alarm_status:[['','—'],['cleared','✅ 解消'],['remaining','🔴 残あり']],
  scada_status:[['','—'],['normal','✅ 正常'],['abnormal','🔴 異常'],['unchecked','未確認']],
  generation_restart_status:[['','—'],['ok','✅ 可'],['conditional','🟡 条件付き'],['no','🔴 不可']],
  chief_review_status:[['not_required','確認不要'],['pending','🟡 待ち'],['confirmed','✅ 済'],['rejected','🔴 差戻し']]
};
async function load(){
  try{ let q='v_restoration_check_list?order=created_at.desc';
    if(WO_ID){ q+=`&work_order_id=eq.${encodeURIComponent(WO_ID)}`; await loadCtx(); }
    ALL=await sb.get(q)||[]; render();
  }catch(e){ document.getElementById('body').innerHTML='<div class="empty">取得エラー: '+esc(e.message)+'</div>'; }
}
async function loadCtx(){
  try{ const w=await sb.get(`work_orders?id=eq.${encodeURIComponent(WO_ID)}&select=work_order_no,turbine_id`);
    const r=w&&w[0]; if(!r) return; let tno=''; try{const t=await sb.get(`turbines?id=eq.${encodeURIComponent(r.turbine_id)}&select=turbine_no`);tno=(t&&t[0]&&t[0].turbine_no)||'';}catch(e){}
    WO_CTX={turbine_id:r.turbine_id};
    document.getElementById('ctxBanner').className='ctx';
    document.getElementById('ctxBanner').innerHTML=`<span style="color:#3fb950;font-weight:700">🔧 作業票</span><b style="color:#fff">${esc(tno)}</b><span style="font-family:monospace;color:#9cd2ff;font-size:12px">${esc(r.work_order_no)}</span><span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${woNav('rest')}</span>`;
  }catch(e){}
}
function fmt(s){return s?String(s).replace('T',' ').slice(0,16):'–';}
function render(){
  const b=document.getElementById('body'); document.getElementById('cnt').textContent=ALL.length+'件';
  if(!ALL.length){ b.innerHTML='<div class="empty">復旧確認の記録はありません。</div>'; return; }
  const cg='<colgroup><col style="width:10%"><col style="width:5%"><col style="width:7%"><col style="width:6%"><col style="width:6%"><col style="width:7%"><col style="width:7%"><col style="width:8%"><col style="width:8%"><col style="width:10%"><col style="width:12%"><col style="width:14%"></colgroup>';
  b.innerHTML=`<table>${cg}<thead><tr><th>作業票番号</th><th>風車</th><th>復旧状態</th><th>試運転</th><th>アラーム</th><th>SCADA</th><th>発電再開</th><th>主任確認</th><th>確認者</th><th>確認日時</th><th>重要事項</th><th>操作</th></tr></thead><tbody>${
    ALL.map(r=>{const imp=r['重要事項']||'';r['chief_review_status_raw']=r.chief_review_status||r['主任確認原値']||'';return `<tr>
      <td class="no"><a onclick="openEdit('${r.id}')">${esc(r['作業票番号'])}</a></td>
      <td style="white-space:nowrap"><b style="color:#fff">${esc(r['風車'])}</b></td>
      <td class="badge">${esc(r['復旧状態'])}</td><td class="badge">${esc(r['試運転'])}</td>
      <td class="badge">${esc(r['アラーム'])}</td><td class="badge">${esc(r['SCADA'])}</td>
      <td class="badge">${esc(r['発電再開'])}</td><td class="badge">${esc(r['主任確認'])}</td>
      <td>${esc(r['確認者'])}</td><td style="white-space:nowrap">${fmt(r['確認日時'])}</td>
      <td style="${imp?'color:#ff9a92':''};font-size:11px">${esc(imp)||'–'}</td>
      <td style="white-space:nowrap">
        ${r['chief_review_status_raw']==='pending'?`
          <button onclick="chiefConfirm('${r.id}','confirmed')" style="font-size:11px;font-weight:700;color:#3fb950;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.4);border-radius:5px;padding:3px 8px;cursor:pointer;margin-right:4px">✅ 確認済み</button>
          <button onclick="chiefConfirm('${r.id}','rejected')" style="font-size:11px;font-weight:700;color:#f85149;background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);border-radius:5px;padding:3px 8px;cursor:pointer">↩ 差戻し</button>
        `:(r['chief_review_status_raw']==='confirmed'?'<span style="color:#3fb950;font-size:11px;font-weight:700">✅ 承認済み</span>':'')}
      </td>
    </tr>`;}).join('')}</tbody></table>`;
}
const selOf=(id,key,cur)=>`<select id="${id}" class="in">${OPT[key].map(o=>`<option value="${o[0]}" ${(cur||'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`;
async function openEdit(id){
  let d={};
  if(id){ try{ const r=await sb.get(`restoration_checks?id=eq.${encodeURIComponent(id)}&select=*`); d=(r&&r[0])||{}; }catch(e){} }
  document.getElementById('pnlTitle').textContent=id?'復旧確認を編集':'復旧確認を記録';
  const dt=s=>s?new Date(s).toISOString().slice(0,16):'';
  document.getElementById('pnlBody').innerHTML=`
    <div class="fld"><label>復旧状態</label>${selOf('f_rest','restoration_status',d.restoration_status||'pending')}</div>
    <div class="g2">
      <div class="fld"><label>試運転</label>${selOf('f_trial','trial_run_status',d.trial_run_status)}</div>
      <div class="fld"><label>アラーム</label>${selOf('f_alarm','alarm_status',d.alarm_status)}</div>
      <div class="fld"><label>SCADA</label>${selOf('f_scada','scada_status',d.scada_status)}</div>
      <div class="fld"><label>発電再開</label>${selOf('f_gen','generation_restart_status',d.generation_restart_status)}</div>
      <div class="fld"><label>主任確認</label>${selOf('f_chief','chief_review_status',d.chief_review_status||'not_required')}</div>
      <div class="fld"><label>確認日時</label><input id="f_at" class="in" type="datetime-local" value="${dt(d.checked_at)}"></div>
      <div class="fld"><label>確認者</label><input id="f_by" class="in" value="${esc(d.checked_by_name||'')}"></div>
      <div class="fld"><label>役割</label><input id="f_role" class="in" placeholder="主任技術者/所長等" value="${esc(d.checked_by_role||'')}"></div>
      <div class="fld"><label>停止終了日時</label><input id="f_oend" class="in" type="datetime-local" value="${dt(d.outage_end_at)}"></div>
      <div class="fld"><label>確定停止時間(分)</label><input id="f_dt" class="in" type="number" min="0" value="${d.final_downtime_minutes??''}"></div>
      <div class="fld"><label>確定逸失電力量(kWh)</label><input id="f_kwh" class="in" type="number" min="0" step="0.1" value="${d.final_lost_kwh??''}"></div>
      <div class="fld"><label>確定逸失売電額(円)</label><input id="f_yen" class="in" type="number" min="0" value="${d.final_lost_revenue_yen??''}"></div>
    </div>
    <div class="fld"><label>復旧コメント</label><textarea id="f_cmt" class="in" rows="2">${esc(d.comment||'')}</textarea></div>
    <div id="f_msg" style="color:#ff9a92;font-size:12px;display:none"></div>`;
  const isExisting = !!id;
  const chf = d.chief_review_status||'not_required';
  const reqBtn = isExisting && chf !== 'confirmed'
    ? `<button class="bq" onclick="requestChiefReview('${id}')">📨 確認依頼</button>` : '';
  document.getElementById('pnlFt').innerHTML=`<button class="bs" onclick="save('${id}')">💾 保存</button>${reqBtn}<button class="bc" onclick="closeEdit()">閉じる</button>`;
  document.getElementById('ov').classList.add('open');document.getElementById('pnl').classList.add('open');
}
function closeEdit(){document.getElementById('ov').classList.remove('open');document.getElementById('pnl').classList.remove('open');}
async function save(id){
  const g=i=>document.getElementById(i),v=i=>g(i).value,msg=g('f_msg');
  if(!id && !WO_ID){ msg.style.display='block';msg.textContent='作業票が特定できません';return; }
  const nn=x=>x===''?null:x;
  const body={
    restoration_status:v('f_rest'), trial_run_status:nn(v('f_trial')), alarm_status:nn(v('f_alarm')),
    scada_status:nn(v('f_scada')), generation_restart_status:nn(v('f_gen')), chief_review_status:v('f_chief'),
    checked_at:v('f_at')?new Date(v('f_at')).toISOString():null, checked_by_name:v('f_by')||null, checked_by_role:v('f_role')||null,
    outage_end_at:v('f_oend')?new Date(v('f_oend')).toISOString():null,
    final_downtime_minutes:v('f_dt')?parseInt(v('f_dt'),10):null,
    final_lost_kwh:v('f_kwh')?parseFloat(v('f_kwh')):null,
    final_lost_revenue_yen:v('f_yen')?parseFloat(v('f_yen')):null,
    comment:v('f_cmt')||null, updated_at:new Date().toISOString()
  };
  try{
    if(id){ const r=await fetch(`${sb.URL}/rest/v1/restoration_checks?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),body:JSON.stringify(body)}); if(!r.ok)throw new Error(await r.text()); }
    else { body.work_order_id=WO_ID; body.turbine_id=(WO_CTX&&WO_CTX.turbine_id)||null; await sb.write('POST','restoration_checks',body); }
    closeEdit(); load();
  }catch(e){ msg.style.display='block';msg.textContent='保存失敗: '+(e.message||e); }
}
async function requestChiefReview(id){
  try{
    await fetch(`${sb.URL}/rest/v1/restoration_checks?id=eq.${encodeURIComponent(id)}`,
      {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),
       body:JSON.stringify({chief_review_status:'pending',updated_at:new Date().toISOString()})});
    closeEdit(); load(); alert('✅ 確認依頼を送信しました');
  }catch(e){alert('失敗: '+e.message);}
}
async function chiefConfirm(id, status){
  const label = status==='confirmed'?'確認済み':'差戻し';
  if(!confirm(label+'にしますか？')) return;
  try{
    const body={chief_review_status:status, updated_at:new Date().toISOString()};
    if(status==='confirmed') body.checked_at=new Date().toISOString();
    await fetch(`${sb.URL}/rest/v1/restoration_checks?id=eq.${encodeURIComponent(id)}`,
      {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),
       body:JSON.stringify(body)});
    load();
  }catch(e){alert('失敗: '+e.message);}
}
sb.requireLogin({onReady:load});
</script>
</body>
</html>
