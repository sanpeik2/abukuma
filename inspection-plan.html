<!DOCTYPE html>




<html lang="ja">




<head>




<meta charset="UTF-8">




<meta name="viewport" content="width=device-width, initial-scale=1.0">




<title>阿武隈OS — 点検管理（ライブ）</title>




<style>




  :root{




    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --line:#30363d; --txt:#c9d1d9; --muted:#8b949e;




    --master:#58a6ff; --insp:#3fb950; --defect:#f85149; --work:#d29922; --legal:#db61a2; --ai:#ff7b72;




  }




  *{box-sizing:border-box;margin:0;padding:0}




  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.55}




  a{color:var(--master);text-decoration:none}




  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11161d,#0d1117)}




  .topbar .mark{width:34px;height:34px;border-radius:7px;background:#d6a84f;color:#1b1300;font-weight:900;display:grid;place-items:center;font-size:13px}




  .topbar h1{font-size:16px;color:#fff;font-weight:700}




  .topbar .sub{font-size:11.5px;color:var(--muted)}




  .topbar .back{margin-left:auto;font-size:13px;color:var(--master)}




  .wrap{padding:18px 22px 50px}




  .kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}




  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 16px;min-width:120px}




  .kpi .v{font-size:22px;font-weight:800;color:#fff} .kpi .l{font-size:11px;color:var(--muted)}




  .kpi.warn .v{color:#ff9a92} .kpi.today .v{color:#9cd2ff}




  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}




  .filters button{background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}




  .filters button.active{color:#fff;border-color:var(--master);background:rgba(88,166,255,.1)}




  table{width:100%;border-collapse:collapse;font-size:12.5px}




  th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;white-space:nowrap}




  th{color:var(--muted);font-weight:600;font-size:11px;position:sticky;top:0;background:var(--bg)}




  tr.overdue td{background:rgba(248,81,73,.06)}




  tr.today td{background:rgba(88,166,255,.06)}




  .pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid;white-space:nowrap}




  .p-nen{color:#ff9a92;border-color:var(--defect);background:rgba(248,81,73,.1)}




  .p-teiki{color:#9cd2ff;border-color:var(--master);background:rgba(88,166,255,.1)}




  .p-zuiji{color:#f0c674;border-color:var(--work);background:rgba(210,153,34,.1)}




  .p-other{color:var(--muted);border-color:var(--line)}




  .wtg{font-family:monospace;color:#fff;font-weight:600}




  .loading,.empty{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}




  .err{color:#ff9a92;font-size:13px;padding:14px;border:1px solid var(--defect);border-radius:8px;background:rgba(248,81,73,.07);margin:18px 0}




  .note{font-size:12px;color:var(--muted);margin-bottom:14px}




</style>




</head>




<body>




<nav id="omFlowBar" aria-label="業務フローステータスバー" style="background:linear-gradient(180deg,#11161d,#0d1117);border-bottom:1px solid #30363d;padding:14px 18px 12px;font-family:'Segoe UI','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;"><span style="display:flex;flex-direction:column;line-height:1.15;border-left:3px solid rgb(63,185,80);padding-left:9px;flex:0 0 auto;"><b style="color:#e6edf3;font-size:12.5px;font-weight:800;letter-spacing:.04em;">業務フロー</b><span style="color:#6e7681;font-size:10px;">現在地</span></span><span style="display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;color:rgb(63,185,80);background:rgba(63,185,80,.13);border:1px solid rgba(63,185,80,.45);">🟢 点検フェーズ</span><span style="flex:1 1 auto;"></span><span style="flex:0 0 auto;color:#8b949e;font-size:11px;font-weight:700;">3 / 11</span><span style="flex:0 0 auto;display:inline-block;width:120px;max-width:30vw;height:5px;border-radius:999px;background:#30363d;overflow:hidden;"><span style="display:block;height:100%;width:20%;border-radius:999px;background:rgb(63,185,80);"></span></span></div><div style="display:flex;align-items:flex-start;flex-wrap:wrap;row-gap:6px;"><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./index.html" title="今日の管制塔（完了・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#238636;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;border:2px solid #238636;box-sizing:border-box;">✓</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#8b949e;font-weight:600;max-width:78px;word-break:break-word;">今日の管制塔</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2p ne-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">点検実施</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./defect-rca.html" title="異常判断（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">5</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">異常判断</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./work-orders.html" title="作業票（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">6</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">作業票</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./permits.html" title="PTW/KY（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">7</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">PTW/KY</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./approvals.html" title="承認（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">8</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">承認</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./work-orders.html" title="作業実施（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">9</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">作業実施</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./defect-rca.html" title="復旧確認（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">10</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">復旧確認</span></a></div><div style="flex:1 1 12px;min-width:8px;height:2px;margin-top:14px;border-radius:2px;background:#30363d;"></div><div style="flex:0 0 auto;width:84px;display:flex;justify-content:center;"><a href="./report-candidates.html" title="クローズ・報告確認（未着手・移動）" style="text-decoration:none;display:flex;flex-direction:column;align-items:center;text-align:center;"><span style="width:28px;height:28px;border-radius:50%;background:#0d1117;color:#6e7681;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #30363d;box-sizing:border-box;">11</span><span style="margin-top:7px;font-size:10.5px;line-height:1.25;color:#6e7681;font-weight:600;max-width:78px;word-break:break-word;">クローズ・報告確認</span></a></div></div></nav>

    <div class="note">点検計画の承認管理画面です。<b>承認済みになると点検実施が可能</b>になります。実施・結果確認は <a href="./inspection-input.html">点検実施</a> へ。PTW が必要な点検は承認前に PTW 番号を記録してください。</div>

  <script>




    const esc = sb.esc;




    const state = { rows: [], filter: "all" };




    const pillClass = { "年次":"p-nen", "定期":"p-teiki", "随時/緊急":"p-zuiji", "その他":"p-other" };









    function renderKpis(){




      const rows = state.rows;




      const cntDraft    = rows.filter(r => (r["approval_status"]||"draft") === "draft").length;
      const cntPending  = rows.filter(r => r["approval_status"] === "pending").length;
      const cntApproved = rows.filter(r => r["approval_status"] === "approved").length;
      const cntReturned = rows.filter(r => r["approval_status"] === "returned").length;
      const cntOverdue  = rows.filter(r => r["期限超過"]).length;

      document.getElementById("kpis").innerHTML =
        `<div class="kpi"><div class="v">${rows.length}</div><div class="l">計画 総数</div></div>
         <div class="kpi"><div class="v">${cntDraft}</div><div class="l">📋 未申請</div></div>
         <div class="kpi today"><div class="v">${cntPending}</div><div class="l">📨 申請中</div></div>
         <div class="kpi"><div class="v">${cntApproved}</div><div class="l">✅ 承認済</div></div>
         <div class="kpi warn"><div class="v">${cntReturned}</div><div class="l">↩ 差戻し</div></div>
         <div class="kpi warn"><div class="v">${cntOverdue}</div><div class="l">⚠ 要対応</div></div>`;




    }









    function unifiedStatusBadge(s){
      const M = {
        planning:        {lbl:'📋 計画中',        c:'#8b949e', bg:'rgba(139,148,158,.10)', bd:'#30363d'},
        plan_pending:    {lbl:'⏳ 計画承認待ち',  c:'#e3b341', bg:'rgba(210,153,34,.12)', bd:'rgba(210,153,34,.5)'},
        returned:        {lbl:'↩ 差戻し中',       c:'#ff9a92', bg:'rgba(248,81,73,.10)',  bd:'rgba(248,81,73,.5)'},
        ready:           {lbl:'✅ 実施待ち',      c:'#7ee787', bg:'rgba(63,185,80,.12)',  bd:'rgba(63,185,80,.5)'},
        inspecting:      {lbl:'🔧 点検中',        c:'#9cd2ff', bg:'rgba(88,166,255,.12)', bd:'rgba(88,166,255,.5)'},
        result_recorded: {lbl:'📝 結果記録済',    c:'#c9d1d9', bg:'rgba(201,209,217,.08)', bd:'#30363d'},
        result_pending:  {lbl:'⏳ 結果承認待ち',  c:'#e3b341', bg:'rgba(210,153,34,.12)', bd:'rgba(210,153,34,.5)'},
        result_approved: {lbl:'✅ 結果承認済',    c:'#7ee787', bg:'rgba(63,185,80,.12)',  bd:'rgba(63,185,80,.5)'},
        anomaly_open:    {lbl:'⚠ 異常判断中',     c:'#ff9a92', bg:'rgba(248,81,73,.10)',  bd:'rgba(248,81,73,.5)'},
        anomaly_approved:{lbl:'🔴 異常・承認済',  c:'#ff7b72', bg:'rgba(255,123,114,.10)', bd:'rgba(255,123,114,.5)'},
        work_ordered:    {lbl:'🔧 作業票化',      c:'#d29922', bg:'rgba(210,153,34,.15)', bd:'rgba(210,153,34,.6)'},
        cancelled:       {lbl:'✖ 中止',           c:'#6e7681', bg:'transparent',           bd:'#30363d'}
      };
      const d = M[s] || M.planning;
      return `<span style="font-size:11px;font-weight:700;color:${d.c};background:${d.bg};border:1px solid ${d.bd};border-radius:6px;padding:3px 9px;white-space:nowrap;">${d.lbl}</span>`;
    }

    function ptwBadge(r){
      const req = r["ptw_required"];
      const num = r["ptw番号"]||"";
      const appSt = r["approval_status"]||"draft";
      const canAct = (appSt==="draft"||appSt==="returned");
      if(!req){
        // PTW不要
        return '<span style="font-size:11px;color:var(--muted);">不要</span>';
      }
      if(num){
        // PTW要・番号あり
        return '<span style="font-size:11px;color:#7ee787;border:1px solid rgba(63,185,80,.4);border-radius:5px;padding:2px 7px;white-space:nowrap;">✅ '+esc(num)+'</span>';
      }
      // PTW要・番号なし → 申請ボタン
      const btn = canAct
        ? '<button onclick="event.stopPropagation();openPtwInput(\''+esc(r["計画id"]||'')+'\')" style="font-size:11px;font-weight:700;color:#db61a2;background:rgba(219,97,162,.10);border:1px solid rgba(219,97,162,.5);border-radius:5px;padding:2px 8px;cursor:pointer;white-space:nowrap;">📋 PTW申請</button>'
        : '<span style="font-size:11px;color:#db61a2;border:1px solid rgba(219,97,162,.4);border-radius:5px;padding:2px 7px;">PTW未取得</span>';
      return btn;
    }
    function deadlineBadge(s){
      if(!s || s === '—') return '<span style="color:var(--muted);">—</span>';
      if(s === '🔵 本日') return '<span style="font-size:11px;font-weight:700;color:#58a6ff;border:1px solid rgba(88,166,255,.5);border-radius:5px;padding:2px 7px;">🔵 本日</span>';
      if(s === '⚪ 予定') return '<span style="font-size:11px;color:var(--muted);">⚪ 予定</span>';
      // 警告系（⚠ から始まる）
      const label = s.replace(/^⚠\s*/,'');
      return '<span style="font-size:11px;font-weight:700;color:#ff9a92;background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.4);border-radius:5px;padding:2px 7px;white-space:nowrap;">⚠ '+label+'</span>';
    }
    function planApprovalBadge(s){
      const lbl={draft:'📋 計画中',pending:'📨 申請中',approved:'✅ 承認済',returned:'↩ 差戻し'};
      const col={draft:'#8b949e',pending:'#e3b341',approved:'#7ee787',returned:'#ff9a92'};
      const bg ={draft:'rgba(139,148,158,.10)',pending:'rgba(210,153,34,.12)',approved:'rgba(63,185,80,.12)',returned:'rgba(248,81,73,.10)'};
      const bd ={draft:'#30363d',pending:'rgba(210,153,34,.5)',approved:'rgba(63,185,80,.5)',returned:'rgba(248,81,73,.5)'};
      const k=s||'draft';
      return '<span style="font-size:11px;font-weight:700;color:'+(col[k]||col.draft)+';background:'+(bg[k]||bg.draft)+';border:1px solid '+(bd[k]||bd.draft)+';border-radius:6px;padding:3px 9px;white-space:nowrap;">'+(lbl[k]||lbl.draft)+'</span>';
    }
    function execMiniTag(us){
      const T={
        ready:          '<span style="font-size:10px;color:var(--muted);margin-left:5px;">/ 未実施</span>',
        inspecting:     '<span style="font-size:10px;color:#9cd2ff;margin-left:5px;">/ 実施中</span>',
        result_recorded:'<span style="font-size:10px;color:#c9d1d9;margin-left:5px;">/ 完了</span>',
        result_pending: '<span style="font-size:10px;color:#e3b341;margin-left:5px;">/ 結果承認待ち</span>',
        result_approved:'<span style="font-size:10px;color:#7ee787;margin-left:5px;">/ 結果承認済</span>',
        anomaly_open:   '<span style="font-size:10px;color:#ff9a92;margin-left:5px;">/ ⚠ 異常あり</span>',
        anomaly_approved:'<span style="font-size:10px;color:#ff7b72;margin-left:5px;">/ 異常・承認済</span>',
        work_ordered:   '<span style="font-size:10px;color:#d29922;margin-left:5px;">/ 作業票化</span>'
      };
      return T[us]||'';
    }
    function render(){




      const body = document.getElementById("body");




      let rows = state.rows.slice();




      const f = state.filter;




      if(f === "all")                   { /* 全件 */ }
      else if(f === "ku_年次")          rows = rows.filter(r => r["点検区分"] === "年次");
      else if(f === "ku_定期")          rows = rows.filter(r => r["点検区分"] === "定期");
      else if(f === "ku_随時緊急")      rows = rows.filter(r => r["点検区分"] === "随時/緊急");
      else if(f === "ku_その他")        rows = rows.filter(r => r["点検区分"] === "その他");
      else                              rows = rows.filter(r => (r["approval_status"]||"draft") === f);




      if(!rows.length){ body.innerHTML = '<div class="empty">該当する計画はありません</div>'; return; }




      body.innerHTML = '<table><thead><tr>' +




        ['計画番号','申請日','号機','作業種別','区分','点検ステータス','計画日','時間','必要資格','人数','PTW','詳細'].map(h=>`<th>${h}</th>`).join('') +




        '</tr></thead><tbody>' + rows.map(r => {




          const ku = r["点検区分"]||"";




          const cls = r["期限超過"] ? "overdue" : (r["期限表示"]==="🔵 本日" ? "today" : "");




          const time = (r["開始"]||"")+(r["終了"]?("〜"+r["終了"]):"");




          return `<tr class="${cls}" data-plan-id="${esc(r["計画id"]||"")}">




            <td style="white-space:nowrap;"><a onclick="event.stopPropagation();openEditPanel('"+esc(r["計画id"]||"")+"')" style="font-family:monospace;font-size:12px;font-weight:700;color:#58a6ff;cursor:pointer;">${esc(r["plan_no"]||"—")}</a></td><td style="color:var(--muted);white-space:nowrap;">${r["申請日"] ? esc(r["申請日"]) : "—"}</td>
            <td><span class="wtg">${esc(r["号機"]||"")}</span></td>
            <td>${esc(r["作業種別"]||"")}</td>
            <td><span class="pill ${pillClass[ku]||'p-other'}">${esc(ku)}</span></td>
            <td style="white-space:nowrap;">${planApprovalBadge(r["approval_status"]||"draft")}${r["approval_status"]==="approved"?execMiniTag(r["unified_status"]||"ready"):""}${(r["approval_status"]==="draft"||r["approval_status"]==="returned")?`<button onclick="event.stopPropagation();submitApproval('${esc(r["計画id"]||"")}')" style="margin-left:6px;font-size:11px;font-weight:700;color:#7ee787;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.5);border-radius:5px;padding:2px 8px;cursor:pointer;white-space:nowrap;">${r["approval_status"]==="returned"?"📨 再申請":"📨 承認申請"}</button>`:""}</td>
            <td style="white-space:nowrap;">${esc(r["計画日"]||"")}</td>




            <td>${esc(time)}</td>




            <td>${esc(r["必要資格"]||"—")}</td>




            <td>${esc(r["作業人数"]??"—")}</td>




            <td style="white-space:nowrap;">${ptwBadge(r)}</td>
            <td style="white-space:nowrap;">${planButtons(r)}</td>




          </tr>`;




        }).join('') + '</tbody></table>';




    }









    document.querySelectorAll("#filters button").forEach(btn =>




      btn.addEventListener("click", () => {




        document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));




        btn.classList.add("active");




        state.filter = btn.dataset.f;




        render();




      }));









    async function loadAll(){




      try{




        state.rows = await sb.get("v_inspection_plan_list?order=計画日.asc");




        renderKpis();




        render();




      }catch(e){




        document.getElementById("body").innerHTML = '<div class="err">データ取得に失敗しました: ' + esc(e.message) + '</div>';




      }




    }




    /* ===== 操作ボタン（ステータス×異常有無で切り替え） ===== */
    const BTN = {
      start:    'text-decoration:none;display:inline-block;font-size:11px;font-weight:700;color:#7ee787;border:1px solid rgba(63,185,80,.5);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
      cont:     'text-decoration:none;display:inline-block;font-size:11px;font-weight:700;color:#9cd2ff;border:1px solid rgba(88,166,255,.5);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
      view:     'text-decoration:none;display:inline-block;font-size:11px;color:#8b949e;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
      anomaly:  'text-decoration:none;display:inline-block;font-size:11px;font-weight:700;color:#f0c674;border:1px solid rgba(210,153,34,.5);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
      wo:       'text-decoration:none;display:inline-block;font-size:11px;color:#8b949e;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
      planWo:   'text-decoration:none;display:inline-block;font-size:11px;font-weight:700;color:#9cd2ff;border:1px solid rgba(88,166,255,.4);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
      approve: 'display:inline-block;font-size:11px;font-weight:700;color:#7ee787;background:rgba(63,185,80,.12);border:1px solid rgba(63,185,80,.5);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;cursor:pointer;',
      revise:  'display:inline-block;font-size:11px;color:#e3b341;background:rgba(210,153,34,.10);border:1px solid rgba(210,153,34,.4);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;cursor:pointer;',
      edit:    'display:inline-block;font-size:11px;color:#9cd2ff;background:rgba(88,166,255,.10);border:1px solid rgba(88,166,255,.4);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;cursor:pointer;',
      locked:  'display:inline-block;font-size:11px;color:#7ee787;border:1px solid rgba(63,185,80,.5);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;',
    };
    // 補修・停止が事前に決まっている計画のキーワード判定
    const REPAIR_KW = ['補修','停止','修理','交換','清掃作業'];

    function planButtons(r){
      const appSt = r["approval_status"] || "draft";
      const rawId = r["計画id"] || "";
      let b = "";

      // ── 詳細ボタン（常に表示・承認状態で編集可否が変わる）──
      // 詳細ボタンのみ（承認申請はステータス列に移動済み）
      b += `<button onclick="openEditPanel('${esc(rawId)}')" style="${BTN.edit}">📄 詳細</button>`;
      b += `<a href="./ky-loto.html?plan_id=${encodeURIComponent(rawId)}" style="display:inline-block;font-size:11px;font-weight:700;color:#e3b341;background:rgba(210,153,34,.12);border:1px solid rgba(210,153,34,.4);border-radius:6px;padding:3px 8px;margin:1px 2px 1px 0;text-decoration:none;">⚠ KY・LOTO</a>`;

      // 差戻しは approvals.html（承認者画面）の権限のため担当者側には表示しない

      return b;
    }
    /* ===== PTW番号 クイック入力 ===== */
    async function openPtwInput(id){
      const num = prompt('PTW番号を入力してください（例: PTW-2026-001）:','');
      if(num === null) return;
      try{
        await fetch(`${sb.URL}/rest/v1/inspection_plans?id=eq.${encodeURIComponent(id)}`,
          {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),
           body:JSON.stringify({ptw_number:num.trim()||null, ptw_required:true})});
        location.reload();
      }catch(e){ alert('PTW番号保存失敗: '+e.message); }
    }

    async function submitApproval(id){
      if(!confirm('この点検計画を承認申請しますか？承認画面（Step 8）に表示されます。')) return;
      try{
        await fetch(`${sb.URL}/rest/v1/inspection_plans?id=eq.${encodeURIComponent(id)}`,
          {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),body:JSON.stringify({approval_status:'pending'})});
        alert('承認申請しました。承認画面（Step 8）で承認してください。');
        location.reload();
      }catch(e){ alert('申請失敗: '+e.message); }
    }

    async function requestRevision(id){
      const reason = prompt('差戻し理由を入力してください（証跡として保存されます）:','');
      if(reason === null) return;
      try{
        await fetch(`${sb.URL}/rest/v1/inspection_plans?id=eq.${encodeURIComponent(id)}`,
          {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),body:JSON.stringify({approval_status:'returned'})});
        alert('差戻し完了。担当者が修正後、再申請できます。');
        location.reload();
      }catch(e){ alert('差戻し失敗: '+e.message); }
    }

    /* ===== インライン編集パネル ===== */
    let _editPanel = null;

    async function openEditPanel(id){
      if(_editPanel === id){ closeEditPanel(); return; }
      _editPanel = id;
      // 対象行の直後に編集パネルを挿入
      const allRows = document.querySelectorAll('tr[data-plan-id]');
      let targetRow = null;
      allRows.forEach(tr => { if(tr.dataset.planId === id) targetRow = tr; });
      if(!targetRow) return;
      // 既存パネルを閉じる
      document.querySelectorAll('.edit-panel-row').forEach(el => el.remove());
      // データ取得
      try{
        const rows = await sb.get(`inspection_plans?id=eq.${encodeURIComponent(id)}&select=*`);
        const d = rows && rows[0];
        if(!d) return;
        const locked = d.approval_status === 'approved' || d.approval_status === 'pending';
        const panel = document.createElement('tr');
        panel.className = 'edit-panel-row';
        const colCount = targetRow.children.length;
        panel.innerHTML = `<td colspan="${colCount}" style="padding:0;background:var(--panel2);border-bottom:2px solid rgba(88,166,255,.4);">
          <div style="padding:16px 20px;">
            <div style="font-size:13px;font-weight:700;color:#9cd2ff;margin-bottom:12px;">
              ✏ 点検計画を編集
              ${locked ? '<span style="margin-left:8px;font-size:11px;color:#e3b341;border:1px solid rgba(210,153,34,.4);border-radius:4px;padding:1px 6px;">'+d.approval_status==='pending'?'⏳ 承認待ち（編集不可）':'🔒 承認済（編集不可）'+'</span>' : ''}
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px;">
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">予定日</label>
                <input id="ep_date" type="date" value="${esc(d.planned_date||'')}" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">作業種別</label>
                <input id="ep_wtype" type="text" value="${esc(d.work_type||'')}" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">開始時刻</label>
                <input id="ep_tstart" type="time" value="${esc((d.time_start||'').substring(0,5))}" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">終了時刻</label>
                <input id="ep_tend" type="time" value="${esc((d.time_end||'').substring(0,5))}" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">作業人数</label>
                <input id="ep_workers" type="number" min="1" max="20" value="${d.worker_count||''}" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">必要資格</label>
                <input id="ep_qual" type="text" value="${esc(d.required_qualification||'')}" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">PTW 要否</label>
                <div style="display:flex;gap:8px;margin-top:2px;">
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;">
                    <input type="radio" id="ep_ptw_req_y" name="ep_ptw_req" value="1" ${d.ptw_required?'checked':''} ${locked?'disabled':''}> 要
                  </label>
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;">
                    <input type="radio" id="ep_ptw_req_n" name="ep_ptw_req" value="0" ${!d.ptw_required?'checked':''} ${locked?'disabled':''}> 不要
                  </label>
                </div>
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">PTW番号</label>
                <input id="ep_ptw" type="text" value="${esc(d.ptw_number||'')}" ${locked?'disabled':''} placeholder="PTW-2026-001" style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;">
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">KY（危険予知）</label>
                <div style="display:flex;gap:12px;margin-top:2px;">
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" id="ep_ky_y" name="ep_ky" value="1" ${d.ky_required?'checked':''} ${locked?'disabled':''}> 要</label>
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" id="ep_ky_n" name="ep_ky" value="0" ${!d.ky_required?'checked':''} ${locked?'disabled':''}> 不要</label>
                </div>
              </div>
              <div>
                <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">LOTO（施錠・タグアウト）</label>
                <div style="display:flex;gap:12px;margin-top:2px;">
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" id="ep_loto_y" name="ep_loto" value="1" ${d.loto_required?'checked':''} ${locked?'disabled':''}> 要</label>
                  <label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;"><input type="radio" id="ep_loto_n" name="ep_loto" value="0" ${!d.loto_required?'checked':''} ${locked?'disabled':''}> 不要</label>
                </div>
              </div>
            </div>
            <div style="margin-bottom:14px;">
              <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px;">備考</label>
              <textarea id="ep_notes" rows="2" ${locked?'disabled':''} style="width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:7px;font-size:13px;font-family:inherit;resize:vertical;">${esc(d.notes||'')}</textarea>
            </div>
            <div id="ep_msg" style="font-size:12px;color:#ff9a92;margin-bottom:8px;display:none;"></div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              ${!locked ? `<button id="ep_save" onclick="saveEditPanel('${esc(id)}')" style="background:#1f6feb;color:#fff;font-weight:700;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;">💾 保存</button>` : ''}
              <button onclick="closeEditPanel()" style="background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;">✕ 閉じる</button>
              ${!locked ? `<span style="font-size:11px;color:var(--muted);">revision_no: ${d.revision_no||1}</span>` : ''}
            </div>
          </div>
        </td>`;
        targetRow.insertAdjacentElement('afterend', panel);
      }catch(e){ alert('データ取得失敗: '+e.message); }
    }

    function closeEditPanel(){
      document.querySelectorAll('.edit-panel-row').forEach(el => el.remove());
      _editPanel = null;
    }

    async function saveEditPanel(id){
      const btn = document.getElementById('ep_save');
      const msgEl = document.getElementById('ep_msg');
      if(btn) btn.disabled = true;
      const patch = {
        planned_date:          document.getElementById('ep_date')?.value   || null,
        work_type:             document.getElementById('ep_wtype')?.value  || null,
        time_start:            document.getElementById('ep_tstart')?.value || null,
        time_end:              document.getElementById('ep_tend')?.value   || null,
        worker_count:          document.getElementById('ep_workers')?.value ? Number(document.getElementById('ep_workers').value) : null,
        required_qualification:document.getElementById('ep_qual')?.value   || null,
        ptw_required:          document.getElementById('ep_ptw_req_y')?.checked ?? false,
        ptw_number:            document.getElementById('ep_ptw')?.value    || null,
        ky_required:           document.getElementById('ep_ky_y')?.checked  ?? false,
        loto_required:         document.getElementById('ep_loto_y')?.checked ?? false,
        notes:                 document.getElementById('ep_notes')?.value  || null,
        updated_at:            new Date().toISOString(),
        revision_no:           999  // actual increment done via DB or just update
      };
      // revision_no は現在値+1 に（取得済みなら使う）
      try{
        const cur = await sb.get(`inspection_plans?id=eq.${encodeURIComponent(id)}&select=revision_no,approval_status`);
        const d = cur && cur[0];
        if(d && (d.approval_status === 'approved' || d.approval_status === 'pending')){
          if(msgEl){ msgEl.textContent = 'このレコードは ' + d.approval_status + ' のため編集できません。'; msgEl.style.display='block'; }
          if(btn) btn.disabled = false;
          return;
        }
        patch.revision_no = (d?.revision_no || 1);
        await fetch(`${sb.URL}/rest/v1/inspection_plans?id=eq.${encodeURIComponent(id)}`,
          {method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),body:JSON.stringify(patch)});
        closeEditPanel();
        location.reload();
      }catch(e){
        if(msgEl){ msgEl.textContent = '保存失敗: ' + (e.message||String(e)); msgEl.style.display='block'; }
        if(btn) btn.disabled = false;
      }
    }
sb.requireLogin({ onReady: loadAll });




  </script>




</body>




</html>
