<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿武隈OS — クローズ・報告確認（ライブ）</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2128;--line:#30363d;--txt:#c9d1d9;--muted:#8b949e;--master:#58a6ff;--legal:#db61a2;--ok:#3fb950;--ng:#f85149}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;line-height:1.55}
  a{color:var(--master);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#11161d,#0d1117)}
  .topbar .mark{width:34px;height:34px;border-radius:7px;background:#db61a2;color:#2a0a1c;font-weight:900;display:grid;place-items:center;font-size:13px}
  .topbar h1{font-size:17px}.topbar .sub{font-size:11.5px;color:var(--muted)}.topbar .back{margin-left:auto;font-size:13px}
  .wrap{padding:16px 14px 50px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  button.r{background:#db61a2;color:#fff;border:none;font-weight:700;font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  th,td{text-align:left;padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
  th{color:var(--muted);font-size:11px;font-weight:700}
  .no a{color:#58a6ff;font-family:monospace;font-size:12px;font-weight:700;cursor:pointer}
  .empty{color:var(--muted);text-align:center;padding:36px}.badge{font-size:11px;font-weight:700;white-space:nowrap}
  .ctx{margin:0 0 14px;padding:11px 14px;border:1px solid rgba(219,97,162,.45);border-radius:9px;background:rgba(219,97,162,.07);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:none}.ov.open{display:block}
  .pnl{position:fixed;top:0;right:0;width:480px;max-width:100vw;height:100%;background:var(--panel);border-left:1px solid var(--line);z-index:801;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}.pnl.open{transform:none}
  .pnl .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .pnl .bd{flex:1;overflow:auto;padding:16px 18px}.pnl .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
  .fld{margin-bottom:11px}.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .in{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--txt);padding:7px 9px;border-radius:7px;font-size:13px;font-family:inherit}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cb{display:flex;align-items:center;gap:7px;font-size:12.5px;margin:5px 0}
  .bs{background:#1f6feb;color:#fff;font-weight:700;border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}.bc{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer}
  .sec{font-size:11px;color:#db61a2;font-weight:700;margin:14px 0 7px;border-left:3px solid #db61a2;padding-left:8px}
</style>
</head>
<body>
<div class="topbar"><div class="mark">AW</div><div><h1>クローズ・報告確認</h1><div class="sub">阿武隈OS — 報告要否・証跡・再発防止・最終クローズの確認（Step 11）</div></div><a class="back" href="./menu.html">≡ メニューへ戻る</a></div>
<div class="wrap">
  <div id="ctxBanner"></div>
  <div class="bar"><button class="r" onclick="openEdit('')">＋ クローズ確認を作成</button><span id="cnt" style="color:var(--muted);font-size:12px"></span></div>
  <div id="body"><div class="empty">読み込み中…</div></div>
</div>
<div class="ov" id="ov" onclick="closeEdit()"></div>
<div class="pnl" id="pnl"><div class="hd"><h3 id="pnlTitle" style="font-size:14px;color:#fff;flex:1">クローズ確認</h3><button class="bc" onclick="closeEdit()">✕</button></div><div class="bd" id="pnlBody"></div><div class="ft" id="pnlFt"></div></div>

<script src="./lib/supabase.js"></script>
<script>
const esc=s=>sb.esc(s==null?'':String(s));
const WO_ID=new URLSearchParams(location.search).get('work_order_id');
let ALL=[], WO_CTX=null;
const RVS=[['open','📋 未確認'],['in_review','🔍 確認中'],['returned','↩ 差戻し'],['closed','✅ クローズ済']];
const REPT=[['','—'],['保安規定報告','保安規定報告'],['事故報告','事故報告'],['社内報告','社内報告'],['顧客報告','顧客報告']];
async function load(){
  try{ let q='v_closeout_review_list?order=created_at.desc';
    if(WO_ID){ q+=`&work_order_id=eq.${encodeURIComponent(WO_ID)}`; await loadCtx(); }
    ALL=await sb.get(q)||[]; render();
  }catch(e){ document.getElementById('body').innerHTML='<div class="empty">取得エラー: '+esc(e.message)+'</div>'; }
}
async function loadCtx(){
  try{ const w=await sb.get(`work_orders?id=eq.${encodeURIComponent(WO_ID)}&select=work_order_no,turbine_id,defect_finding_id`);
    const r=w&&w[0]; if(!r) return; let tno=''; try{const t=await sb.get(`turbines?id=eq.${encodeURIComponent(r.turbine_id)}&select=turbine_no`);tno=(t&&t[0]&&t[0].turbine_no)||'';}catch(e){}
    WO_CTX={defect_finding_id:r.defect_finding_id};
    document.getElementById('ctxBanner').className='ctx';
    document.getElementById('ctxBanner').innerHTML=`<span style="color:#db61a2;font-weight:700">🔧 作業票</span><b style="color:#fff">${esc(tno)}</b><span style="font-family:monospace;color:#9cd2ff;font-size:12px">${esc(r.work_order_no)}</span><a href="./work-orders.html" style="margin-left:auto;font-size:12px">← 作業票へ戻る</a>`;
  }catch(e){}
}
function fmt(s){return s?String(s).replace('T',' ').slice(0,16):'–';}
function yn(b){return b?'✅':'–';}
function render(){
  const b=document.getElementById('body'); document.getElementById('cnt').textContent=ALL.length+'件';
  if(!ALL.length){ b.innerHTML='<div class="empty">クローズ確認の記録はありません。</div>'; return; }
  const cg='<colgroup><col style="width:12%"><col style="width:6%"><col style="width:10%"><col style="width:9%"><col style="width:7%"><col style="width:11%"><col style="width:8%"><col style="width:7%"><col style="width:7%"><col style="width:9%"><col style="width:11%"></colgroup>';
  b.innerHTML=`<table>${cg}<thead><tr><th>作業票番号</th><th>風車</th><th>クローズ状態</th><th>復旧状態</th><th>報告要否</th><th>報告種別/期限</th><th>証跡</th><th>PTW終了</th><th>LOTO解除</th><th>確認者</th><th>クローズ日時</th></tr></thead><tbody>${
    ALL.map(r=>`<tr>
      <td class="no"><a onclick="openEdit('${r.id}')">${esc(r['作業票番号'])}</a></td>
      <td style="white-space:nowrap"><b style="color:#fff">${esc(r['風車'])}</b></td>
      <td class="badge">${esc(r['クローズ状態'])}</td><td class="badge">${esc(r['復旧状態'])}</td>
      <td class="badge">${r['報告要否']?'<span style="color:#ff9a92">要</span>':'<span style="color:var(--muted)">不要</span>'}</td>
      <td>${esc(r['報告種別']||'–')}${r['報告期限']?'<br><span style="color:#e3b341;font-size:11px">期限 '+esc(r['報告期限'])+'</span>':''}</td>
      <td class="badge">${esc(r['証跡'])}</td><td class="badge">${yn(r['PTW終了'])}</td><td class="badge">${yn(r['LOTO解除'])}</td>
      <td>${esc(r['確認者'])}</td><td style="white-space:nowrap">${fmt(r['クローズ日時'])}</td>
    </tr>`).join('')}</tbody></table>`;
}
async function openEdit(id){
  let d={};
  if(id){ try{ const r=await sb.get(`closeout_reviews?id=eq.${encodeURIComponent(id)}&select=*`); d=(r&&r[0])||{}; }catch(e){} }
  document.getElementById('pnlTitle').textContent=id?'クローズ確認を編集':'クローズ確認を作成';
  const dt=s=>s?new Date(s).toISOString().slice(0,16):'';
  const cb=(idc,lbl,ck)=>`<label class="cb"><input type="checkbox" id="${idc}" ${ck?'checked':''}> ${lbl}</label>`;
  document.getElementById('pnlBody').innerHTML=`
    <div class="fld"><label>クローズ状態</label><select id="f_rv" class="in">${RVS.map(s=>`<option value="${s[0]}" ${(d.review_status||'open')===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></div>
    <div class="sec">報告</div>
    ${cb('f_rep','報告が必要',d.report_required)}
    <div class="g2"><div class="fld"><label>報告種別</label><select id="f_rept" class="in">${REPT.map(o=>`<option value="${o[0]}" ${(d.report_type||'')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
    <div class="fld"><label>報告期限</label><input id="f_dl" class="in" type="date" value="${esc(d.report_deadline||'')}"></div></div>
    <div class="sec">証跡</div>
    <div class="fld"><label>証跡状態</label><select id="f_ev" class="in"><option value="insufficient" ${(d.evidence_status||'insufficient')==='insufficient'?'selected':''}>⚠ 不足</option><option value="confirmed" ${d.evidence_status==='confirmed'?'selected':''}>✅ 確認済</option></select></div>
    ${cb('f_photo','写真添付あり',d.photo_attached)}${cb('f_rec','作業記録添付あり',d.work_record_attached)}
    ${cb('f_ptw','PTW終了確認',d.permit_closed)}${cb('f_loto','LOTO解除確認',d.loto_released)}
    <div class="sec">再発防止・残課題</div>
    ${cb('f_rar','再発防止が必要',d.recurrence_action_required)}
    <div class="fld"><label>再発防止策</label><textarea id="f_ra" class="in" rows="2">${esc(d.recurrence_action||'')}</textarea></div>
    <div class="fld"><label>残課題</label><textarea id="f_ri" class="in" rows="2">${esc(d.remaining_issue||'')}</textarea></div>
    <div class="sec">クローズ</div>
    <div class="g2"><div class="fld"><label>確認者</label><input id="f_by" class="in" value="${esc(d.closed_by_name||'')}"></div>
    <div class="fld"><label>クローズ日時</label><input id="f_at" class="in" type="datetime-local" value="${dt(d.closed_at)}"></div></div>
    <div class="fld"><label>最終コメント</label><textarea id="f_cmt" class="in" rows="2">${esc(d.comment||'')}</textarea></div>
    <div id="f_msg" style="color:#ff9a92;font-size:12px;display:none"></div>`;
  document.getElementById('pnlFt').innerHTML=`<button class="bs" onclick="save('${id}')">💾 保存</button><button class="bc" onclick="closeEdit()">閉じる</button>`;
  document.getElementById('ov').classList.add('open');document.getElementById('pnl').classList.add('open');
}
function closeEdit(){document.getElementById('ov').classList.remove('open');document.getElementById('pnl').classList.remove('open');}
async function save(id){
  const g=i=>document.getElementById(i),v=i=>g(i).value,ck=i=>g(i).checked,msg=g('f_msg');
  if(!id && !WO_ID){ msg.style.display='block';msg.textContent='作業票が特定できません';return; }
  const body={
    review_status:v('f_rv'), report_required:ck('f_rep'), report_type:v('f_rept')||null, report_deadline:v('f_dl')||null,
    evidence_status:v('f_ev'), photo_attached:ck('f_photo'), work_record_attached:ck('f_rec'),
    permit_closed:ck('f_ptw'), loto_released:ck('f_loto'),
    recurrence_action_required:ck('f_rar'), recurrence_action:v('f_ra')||null, remaining_issue:v('f_ri')||null,
    closed_by_name:v('f_by')||null, closed_at:v('f_at')?new Date(v('f_at')).toISOString():null, comment:v('f_cmt')||null,
    updated_at:new Date().toISOString()
  };
  try{
    if(id){ const r=await fetch(`${sb.URL}/rest/v1/closeout_reviews?id=eq.${encodeURIComponent(id)}`,{method:'PATCH',headers:sb.headers({'Prefer':'return=minimal','Content-Type':'application/json'}),body:JSON.stringify(body)}); if(!r.ok)throw new Error(await r.text()); }
    else { body.work_order_id=WO_ID; body.defect_finding_id=(WO_CTX&&WO_CTX.defect_finding_id)||null; await sb.write('POST','closeout_reviews',body); }
    closeEdit(); load();
  }catch(e){ msg.style.display='block';msg.textContent='保存失敗: '+(e.message||e); }
}
sb.requireLogin({onReady:load});
</script>
</body>
</html>
